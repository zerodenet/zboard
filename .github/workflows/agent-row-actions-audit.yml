name: Audit admin row actions

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Persist administration row-action audit
        shell: bash
        run: |
          set -euo pipefail
          report=admin-row-actions-audit.txt
          if [[ -f "$report" ]]; then
            echo "Audit report already exists."
            exit 0
          fi
          {
            echo '=== action-slot locations ==='
            grep -RInE '<template[^>]+#(cell\.)?(actions|operation|operations)|label="(操作|Actions)"|key="(actions|operation|operations)"' frontend/src/views frontend/src/components || true
            echo '=== RowActions usage ==='
            grep -RInE 'RowActions|RowActionMenu|inline-actions|action-buttons|table-actions|row-actions' frontend/src/views frontend/src/components || true
            echo '=== button clusters near action labels ==='
            python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('frontend/src/views'), Path('frontend/src/components')]
          for root in roots:
              for path in sorted(root.rglob('*.vue')):
                  text = path.read_text(encoding='utf-8')
                  lines = text.splitlines()
                  hits = [i for i, line in enumerate(lines) if re.search(r'(操作|Actions|actions|operation|inline-actions|RowActions|RowActionMenu)', line)]
                  if not hits:
                      continue
                  print(f'--- {path} ---')
                  printed = set()
                  for i in hits:
                      start, end = max(0, i-5), min(len(lines), i+12)
                      key = (start, end)
                      if key in printed:
                          continue
                      printed.add(key)
                      for n in range(start, end):
                          print(f'{n+1:04d}: {lines[n]}')
          PY
          } > "$report"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m 'chore: record admin row action audit'
          git push origin HEAD:${{ github.head_ref }}
