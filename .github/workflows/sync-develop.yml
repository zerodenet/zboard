name: sync-develop

on:
  push:
    branches: [feat/sku-operations]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Merge latest develop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/sync-develop.yml
          git commit --amend --no-edit
      - name: Verify backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          go build ./cmd/zboard
      - name: Verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Push synchronized branch
        run: git push origin HEAD:feat/sku-operations
