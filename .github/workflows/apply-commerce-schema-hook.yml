name: apply-commerce-schema-hook

on:
  push:
    branches:
      - feat/sku-operations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - name: Update router startup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/server/router.go')
          source = path.read_text()
          source = source.replace(
              '"github.com/zerodenet/zboard/backend/internal/handler"',
              '"github.com/zerodenet/zboard/backend/internal/datastore"\n\t"github.com/zerodenet/zboard/backend/internal/handler"',
              1,
          )
          source = source.replace(
              'func RegisterRoutes(srv *rest.Server, db *gorm.DB, jwtSecret string, credentialCipher *security.CredentialCipher, zeroArtifactDir, zeroKernelContract, zeroLocalVersion string) error {\n\th, err := handler.NewHandlers',
              'func RegisterRoutes(srv *rest.Server, db *gorm.DB, jwtSecret string, credentialCipher *security.CredentialCipher, zeroArtifactDir, zeroKernelContract, zeroLocalVersion string) error {\n\tif err := datastore.ReconcileCommerceSchema(db); err != nil {\n\t\treturn err\n\t}\n\th, err := handler.NewHandlers',
              1,
          )
          path.write_text(source)
          PY
          cd backend && gofmt -w internal/server/router.go
      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/server/router.go
          git commit -m "fix: reconcile commerce schema before route registration"
          git push origin HEAD:feat/sku-operations
