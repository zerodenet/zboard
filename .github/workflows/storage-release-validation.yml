name: storage-release-validation
on:
  push:
    branches: [codex/storage-validation-20261104]
permissions:
  contents: read
jobs:
  core-groups:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mysql: '8.4', group: business-06-01}
          - {mysql: '8.4', group: business-06-02}
          - {mysql: '8.4', group: business-06-03}
          - {mysql: '8.4', group: business-06-04}
          - {mysql: '8.4', group: business-06-05}
          - {mysql: '8.4', group: business-06-06}
          - {mysql: '8.4', group: business-06-07}
          - {mysql: '8.4', group: business-06-08}
          - {mysql: '8.4', group: business-06-09}
          - {mysql: '8.2.0', group: tail}
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: zboard-isolated-storage
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pzboard-isolated-storage"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      ZBOARD_TEST_MYSQL_DSN: root:zboard-isolated-storage@tcp(127.0.0.1:3306)/?parseTime=true&loc=UTC
      STORAGE_ACCEPTANCE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e07ee60816bcf46da0c0006c8bf350166680c2e2
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify exact deployed application trees
        shell: bash
        run: |
          test "$(git rev-parse HEAD:backend)" = 2af9d6a929cabb0e1a6408825886165b4f7cbd3e
          test "$(git rev-parse HEAD:frontend)" = 736b7beed87ade297f7f12834490a8579a0e6e05
          test "$(git rev-parse HEAD:VERSION)" = e610c69f126cc33e3868bdaaaca5bef0edd27afe
      - name: Discover and prove full core selection
        run: python3 scripts/mysql_profiles.py --profile core --plan-only --output-dir artifacts/plan
      - name: Run exact bounded group without retries or timeout changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import mysql_profiles as p
          root=Path.cwd();backend=root/'backend';directory=root/'artifacts'/'execution';directory.mkdir(parents=True)
          plan=json.loads((root/'artifacts/plan/plan.json').read_text())
          part=json.loads((root/'artifacts/plan/partition.json').read_text())
          expected_core={tuple(x) for x in part['core']}
          assert len(expected_core)==447
          assert set().union(*({tuple(x) for x in item['expected']} for item in plan))==expected_core
          assert sum(len(item['expected']) for item in plan)==447
          group=os.environ['STORAGE_ACCEPTANCE_GROUP']
          if group=='tail':
           names={'TestMySQLAccountingWaitDoesNotHoldNodeStatsWriteLock','TestMySQLAccountingWaitRechecksConcurrentNodeDeletion','TestMySQLConsumerBoundsTransactionsAndDrainsBacklog','TestMySQLNodeStatsFailureRetainsSettlementAndRetriesProjection','TestMySQLZeroEventWindowPreservesRoundedAccountingAndReplay','TestMySQLZeroWindowFallsBackForDatabaseEquivalentReportIDs'}
           expected={('./internal/handler',name) for name in names};assert expected<=expected_core
           command=['go','test','-json','-p','1','./internal/handler','-run',p.positive_regex(names),'-count=1','-timeout','15m']
          else:
           item=next(item for item in plan if item['group']==group)
           assert item['command'][5]=='./internal/handler', item['command']
           expected={tuple(x) for x in item['expected']};assert len(expected)<=32
           command=item['command']
          module=re.search(r'^module\s+(\S+)',(backend/'go.mod').read_text(),re.M).group(1)
          log=directory/'events.jsonl';commands=[]
          code=p.run_command(command,backend,log,commands)
          events=p.read_events(log);summary=p.result_summary(events,expected,module)
          receipt={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'group':group,'expected':sorted(expected),'command':command,'exit_code':code,'summary':summary,'source_before':json.loads((root/'artifacts/plan/source-sha256.json').read_text())}
          receipt['source_after']=p.source_fingerprints(root)
          assert receipt['source_before']==receipt['source_after']
          (directory/'receipt.json').write_text(json.dumps(receipt,indent=2))
          if code or not summary['complete']:
           for line in p.execution_failure_diagnostics(events,summary):print(line)
           raise SystemExit(1)
          print('Validated exact group',group,'passed',summary['passed'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.mysql }}-${{ matrix.group }}-e07ee60
          path: artifacts
          if-no-files-found: error
