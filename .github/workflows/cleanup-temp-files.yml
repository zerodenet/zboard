name: cleanup-temp-files

on:
  push:
    branches: [feat/sku-operations]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - name: Remove temporary patch artifacts
        run: |
          rm -f \
            .github/workflows/apply-plan-entitlement-authority.yml \
            .github/workflows/trigger-entitlement-authority.yml \
            .github/workflows/apply-plan-entitlement-frontend.yml \
            .github/workflows/apply-plan-entitlement-frontend-v2.yml \
            .github/trigger-plan-entitlement-frontend \
            .github/restore-marker \
            .github/cleanup-probe
          cat > .github/workflows/ci.yml <<'YAML'
          name: ci

          on:
            push:
              branches: ["main", "develop"]
            pull_request:

          jobs:
            backend:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version-file: backend/go.mod
                    cache-dependency-path: backend/go.sum
                - name: Verify module files are tidy
                  run: |
                    go mod tidy
                    git diff --exit-code -- go.mod go.sum
                - name: Format
                  run: test -z "$(gofmt -l .)"
                - name: Test
                  run: go test ./...
                - name: Vet
                  run: go vet ./...
                - name: Build
                  run: go build ./cmd/zboard

            frontend:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: frontend
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.9.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22.23.0"
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml
                - name: Install
                  run: pnpm install --frozen-lockfile
                - name: Typecheck and build
                  run: pnpm build

            contract:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Check OpenAPI contract
                  uses: docker://redocly/cli:1.34.3
                  with:
                    args: lint backend/api/openapi.yaml
          YAML
          git rm .github/workflows/cleanup-temp-files.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary patch workflows'
          git push origin HEAD:feat/sku-operations
