name: frontend-patch-runner

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/sku-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Patch and verify frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          plans = Path('frontend/src/views/Plans.vue')
          source = plans.read_text()
          old = "  traffic_bytes: 'traffic_bytes',\n  device_limit: 'sku.device_limit',\n  speed_limit_mbps: 'sku.speed_limit_mbps',\n  max_active_subscriptions: 'max_active_subscriptions',"
          new = "  traffic_bytes: 'traffic_bytes',\n  device_limit: 'sku.device_limit',\n  max_active_subscriptions: 'max_active_subscriptions',\n  speed_limit_mbps: 'sku.speed_limit_mbps',"
          if source.count(old) != 1:
              raise SystemExit('create field map preparation not found')
          plans.write_text(source.replace(old, new, 1))

          original = Path('.github/workflows/apply-plan-entitlement-frontend.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n          cd frontend"
          start = original.index(start_marker) + len(start_marker)
          end = original.index(end_marker, start)
          patch_lines = original[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in patch_lines) + "\n"
          Path('/tmp/frontend_patch.py').write_text(script)
          PY
          python /tmp/frontend_patch.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          path = Path('frontend/src/api/client.ts')
          source = path.read_text()
          source = replace_once(
              source,
              'export interface PlanCatalogItem extends PlanSummary {\n  primary_sku?: PlanSKU\n}',
              'export interface PlanCatalogItem extends PlanSummary {\n  traffic_bytes: number\n  speed_limit_mbps: number\n  device_limit: number\n  primary_sku?: PlanSKU\n}',
              'Plan catalog entitlements',
          )
          path.write_text(source)

          path = Path('frontend/src/views/PublicPlans.vue')
          source = path.read_text()
          source = replace_once(source, 'formatBytes(plan.primary_sku.traffic_bytes)', 'formatBytes(plan.traffic_bytes)', 'public traffic')
          source = replace_once(source, "plan.primary_sku.device_limit || '不限'", "plan.device_limit || '不限'", 'public device')
          source = replace_once(source, 'plan.primary_sku.speed_limit_mbps ? `${plan.primary_sku.speed_limit_mbps} Mbps` : \'不限速\'', 'plan.speed_limit_mbps ? `${plan.speed_limit_mbps} Mbps` : \'不限速\'', 'public speed')
          path.write_text(source)

          path = Path('frontend/src/views/account/AccountPlans.vue')
          source = path.read_text()
          source = replace_once(source, 'formatBytes(sku.traffic_bytes)', 'formatBytes(selectedPlan?.traffic_bytes || 0)', 'account traffic')
          source = replace_once(source, "sku.device_limit || '不限'", "selectedPlan?.device_limit || '不限'", 'account device')
          source = replace_once(source, 'sku.speed_limit_mbps ? `${sku.speed_limit_mbps} Mbps` : \'不限速\'', 'selectedPlan?.speed_limit_mbps ? `${selectedPlan.speed_limit_mbps} Mbps` : \'不限速\'', 'account speed')
          path.write_text(source)
          PY
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit frontend update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          git commit -m 'fix: keep plan entitlements out of SKU forms'
          git push origin HEAD:feat/sku-operations
