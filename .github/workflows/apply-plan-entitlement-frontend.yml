name: apply-plan-entitlement-frontend

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/sku-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Apply frontend entitlement ownership changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          def replace_region(source: str, start: str, end: str, transform, label: str) -> str:
              left = source.index(start)
              right = source.index(end, left)
              region = source[left:right]
              updated = transform(region)
              if region == updated:
                  raise SystemExit(f'{label}: region was not changed')
              return source[:left] + updated + source[right:]

          client = Path('frontend/src/api/client.ts')
          source = client.read_text()
          interface = '''export interface PlanSKU {
  id: number
  plan_id: number
  code: string
  name: string
  sku_type: string
  billing_mode?: 'periodic' | 'one_time'
  allowed_operations?: Array<'purchase' | 'renew' | 'change' | 'addon'>
  billing_unit: string
  billing_value: number
  price_cents: number
  currency: string
  grant_traffic_bytes: number
  is_active: boolean
  sort_order: number
  created_at: string
  updated_at: string
}

export interface PlanSummary'''
          source, count = re.subn(
              r'export interface PlanSKU \{.*?\n\}\n\nexport interface PlanSummary',
              interface,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('PlanSKU interface not found')
          client.write_text(source)

          path = Path('frontend/src/views/Plans.vue')
          source = path.read_text()
          source = replace_once(source,
              '            <p>SKU 决定新订单的价格、周期、流量和设备限制。</p>',
              '            <p>商品统一定义流量、限速和设备数；SKU 只定义价格、周期和可用场景。</p>',
              'SKU description')
          source = replace_once(source,
              '                <th data-column-priority="2">流量</th>\n                <th class="numeric-column" data-column-priority="3">设备数</th>',
              '                <th data-column-priority="2">权益来源</th>',
              'SKU table headers')
          source = replace_once(source,
              '                <td data-column-priority="2">{{ formatBytes(sku.traffic_bytes) }}</td>\n                <td class="numeric-column" data-column-priority="3">{{ sku.device_limit }}</td>',
              "                <td data-column-priority=\"2\">{{ sku.sku_type === 'traffic_pack' ? `增加 ${formatBytes(sku.grant_traffic_bytes)}` : '继承商品权益' }}</td>",
              'SKU table entitlement')
          source = replace_once(source,
              '<div class="form-section-title"><span>2</span><div><h3>首个销售规格</h3><p>定义价格、计费周期和服务限制。</p></div></div>',
              '<div class="form-section-title"><span>2</span><div><h3>首个销售规格</h3><p>定义价格和计费周期；套餐权益在下一步统一配置。</p></div></div>',
              'create SKU description')
          for name in ('create-plan-traffic', 'create-plan-device-limit', 'create-plan-speed-limit'):
              source, count = re.subn(rf'^\s*<FormField[^\n]*name="{name}"[^\n]*\n', '', source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'{name}: field not found')
          source = replace_once(source,
              '<div class="form-section-title"><span>3</span><div><h3>流量与交付边界</h3><p>套餐只关联节点组；协议端点及倍率由节点组和协议服务维护。</p></div></div>',
              '<div class="form-section-title"><span>3</span><div><h3>套餐权益与交付边界</h3><p>这些权益由商品统一定义，所有周期 SKU 共享。</p></div></div>',
              'Plan entitlement section')
          node_group = '            <FormField v-slot="{ controlAttrs }" label="节点组" name="create-plan-node-group" hint="按名称、代码或说明远程搜索，不预载全部节点组。" :error="createErrors.fields.node_group_id" required><NodeGroupLookup v-model="form.node_group_id" v-bind="controlAttrs" /></FormField>'
          plan_fields = '''            <FormField v-slot="{ controlAttrs }" label="流量配额" name="create-plan-traffic" hint="统一以 GiB 输入并换算为字节保存。" :error="createErrors.fields.traffic_bytes" required><ByteSizeInput v-model="form.traffic_bytes" v-bind="controlAttrs" :min-bytes="1024 ** 3" /></FormField>
            <FormField v-slot="{ controlAttrs }" label="设备数" name="create-plan-device-limit" :error="createErrors.fields.device_limit" required><UiNumberInput v-model="form.device_limit" v-bind="controlAttrs" :min="1" inputmode="numeric" /></FormField>
            <FormField v-slot="{ controlAttrs }" label="速率限制" name="create-plan-speed-limit" hint="0 表示不限速。" :error="createErrors.fields.speed_limit_mbps"><UiNumberInput v-model="form.speed_limit_mbps" v-bind="controlAttrs" :min="0" suffix=" Mbps" /></FormField>
''' + node_group
          source = replace_once(source, node_group, plan_fields, 'insert Plan fields')
          for name in ('edit-sku-traffic', 'edit-sku-device-limit', 'edit-sku-speed-limit'):
              source, count = re.subn(rf'^\s*<FormField[^\n]*name="{name}"[^\n]*\n', '', source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'{name}: field not found')
          sort_field = '        <FormField v-slot="{ controlAttrs }" label="排序" name="edit-sku-sort-order" :error="skuErrors.fields.sort_order"><UiNumberInput v-model="skuDraft.sort_order" v-bind="controlAttrs" inputmode="numeric" /></FormField>'
          addon_field = '        <FormField v-if="skuDraft.sku_type === \'traffic_pack\'" v-slot="{ controlAttrs }" label="附加流量" name="edit-sku-grant-traffic" hint="只增加目标订阅的可用流量，不修改套餐限速和设备数。" :error="skuErrors.fields.grant_traffic_bytes"><ByteSizeInput v-model="skuDraft.grant_traffic_bytes" v-bind="controlAttrs" :min-bytes="1" /></FormField>\n' + sort_field
          source = replace_once(source, sort_field, addon_field, 'addon grant editor')
          source = replace_once(source,
              "  currency: 'CNY',\n  traffic_bytes: 100 * 1024 ** 3,\n  device_limit: 3,\n  speed_limit_mbps: 0,",
              "  currency: 'CNY',\n  grant_traffic_bytes: 0,",
              'empty SKU')
          source = replace_once(source,
              '  traffic_bytes: 100 * 1024 ** 3,\n  node_group_id: 0,',
              '  traffic_bytes: 100 * 1024 ** 3,\n  speed_limit_mbps: 0,\n  device_limit: 3,\n  node_group_id: 0,',
              'empty Plan form')
          source = replace_once(source,
              "      message: '离开套餐管理后，尚未保存的价格、周期和配额修改将丢失。',",
              "      message: '离开套餐管理后，尚未保存的价格、周期和可用场景修改将丢失。',",
              'unsaved SKU message')

          def update_create_map(region: str) -> str:
              region = region.replace("  device_limit: 'sku.device_limit',", "  device_limit: 'device_limit',", 1)
              region = region.replace("  speed_limit_mbps: 'sku.speed_limit_mbps',", "  speed_limit_mbps: 'speed_limit_mbps',", 1)
              region = region.replace(
                  "  'skus.0.traffic_bytes': 'traffic_bytes',\n  'skus.0.device_limit': 'sku.device_limit',\n  'skus.0.speed_limit_mbps': 'sku.speed_limit_mbps',",
                  "  'skus.0.grant_traffic_bytes': 'sku.grant_traffic_bytes',",
                  1,
              )
              return region
          source = replace_region(source, 'const createPlanFieldMap', 'const planFieldMap', update_create_map, 'create map')

          def update_sku_map(region: str) -> str:
              return region.replace(
                  "  traffic_bytes: 'traffic_bytes',\n  device_limit: 'device_limit',\n  speed_limit_mbps: 'speed_limit_mbps',",
                  "  grant_traffic_bytes: 'grant_traffic_bytes',",
                  1,
              )
          source = replace_region(source, 'const skuFieldMap', 'const activeOptions', update_sku_map, 'SKU map')
          source = replace_once(source,
              "  [() => form.sku.price_cents, 'sku.price_cents'],\n  [() => form.sku.device_limit, 'sku.device_limit'],\n  [() => form.sku.speed_limit_mbps, 'sku.speed_limit_mbps'],",
              "  [() => form.sku.price_cents, 'sku.price_cents'],\n  [() => form.sku.grant_traffic_bytes, 'sku.grant_traffic_bytes'],\n  [() => form.device_limit, 'device_limit'],\n  [() => form.speed_limit_mbps, 'speed_limit_mbps'],",
              'entitlement watchers')
          source = replace_once(source,
              "function skuValidation(sku: PlanSKU | ReturnType<typeof emptySKU>, prefix = '', trafficBytes = sku.traffic_bytes) {",
              "function skuValidation(sku: PlanSKU | ReturnType<typeof emptySKU>, prefix = '') {",
              'SKU validation signature')
          source = replace_once(source,
              "    [field('traffic_bytes')]: !isIntegerInRange(trafficBytes, 1, Number.MAX_SAFE_INTEGER) && '流量配额必须大于 0。',\n    [field('device_limit')]: !isIntegerInRange(sku.device_limit, 1, Number.MAX_SAFE_INTEGER) && '设备数必须为大于 0 的整数。',\n    [field('speed_limit_mbps')]: !isIntegerInRange(sku.speed_limit_mbps, 0, Number.MAX_SAFE_INTEGER) && '速率限制必须为不小于 0 的整数。',",
              "    [field('grant_traffic_bytes')]: sku.sku_type === 'traffic_pack' && !isIntegerInRange(sku.grant_traffic_bytes, 1, Number.MAX_SAFE_INTEGER) && '流量包的附加流量必须大于 0。',",
              'SKU entitlement validation')
          source = replace_once(source,
              "  const firstSKUValidation = skuValidation(form.sku, 'sku.', form.traffic_bytes)\n  delete firstSKUValidation['sku.traffic_bytes']",
              "  const firstSKUValidation = skuValidation(form.sku, 'sku.')",
              'create validation call')
          source = replace_once(source,
              "      traffic_bytes: !isIntegerInRange(form.traffic_bytes, 1, Number.MAX_SAFE_INTEGER) && '流量配额必须大于 0。',",
              "      traffic_bytes: !isIntegerInRange(form.traffic_bytes, 1, Number.MAX_SAFE_INTEGER) && '流量配额必须大于 0。',\n      speed_limit_mbps: !isIntegerInRange(form.speed_limit_mbps, 0, Number.MAX_SAFE_INTEGER) && '速率限制必须为不小于 0 的整数。',\n      device_limit: !isIntegerInRange(form.device_limit, 1, Number.MAX_SAFE_INTEGER) && '设备数必须为大于 0 的整数。',",
              'Plan create validation')
          source = replace_once(source, '      speed_limit_mbps: form.sku.speed_limit_mbps,', '      speed_limit_mbps: form.speed_limit_mbps,', 'speed payload')
          source = replace_once(source, '      device_limit: form.sku.device_limit,', '      device_limit: form.device_limit,', 'device payload')
          sku_payload = '''      skus: [{
        code: form.sku.code,
        name: form.sku.name,
        sku_type: form.sku.sku_type,
        billing_unit: form.sku.billing_unit,
        billing_value: form.sku.billing_value,
        price_cents: form.sku.price_cents,
        currency: form.sku.currency,
        grant_traffic_bytes: form.sku.sku_type === 'traffic_pack' ? form.sku.grant_traffic_bytes : 0,
        is_active: true,
        sort_order: form.sku.sort_order,
      }],'''
          source = replace_once(source,
              '      skus: [{ ...form.sku, traffic_bytes: form.traffic_bytes, is_active: true }],',
              sku_payload,
              'create SKU payload')
          source = replace_once(source,
              '    traffic_bytes: skuDraft.traffic_bytes,\n    device_limit: skuDraft.device_limit,\n    speed_limit_mbps: skuDraft.speed_limit_mbps,',
              "    grant_traffic_bytes: skuDraft.sku_type === 'traffic_pack' ? skuDraft.grant_traffic_bytes : 0,",
              'SKU mutation payload')
          path.write_text(source)
          PY
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit frontend update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "fix: keep plan entitlements out of SKU forms"
          git push origin HEAD:feat/sku-operations
