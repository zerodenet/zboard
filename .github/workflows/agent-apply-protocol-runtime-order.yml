name: Apply stable protocol runtime order

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/classify-protocol-endpoint-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply stable runtime order
        run: python3 scripts/apply-protocol-runtime-order.py
      - name: Format and test backend
        run: |
          gofmt -w backend/internal/handler/protocol_endpoint_effects.go backend/internal/handler/protocol_endpoint_effects_test.go backend/internal/handler/kernel_automation.go
          cd backend
          go test ./internal/handler
      - name: Commit applied patch
        run: |
          rm scripts/apply-protocol-runtime-order.py
          rm .github/workflows/agent-apply-protocol-runtime-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep delivery order out of runtime config"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
