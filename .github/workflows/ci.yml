name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: write

jobs:
  apply-plan-entitlement-catalog:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sku-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Expose authoritative entitlements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/handler/handlers.go')
          source = path.read_text()
          if 'TrafficBytes   int64          `json:"traffic_bytes"`' not in source:
              old = '''type planCatalogItem struct {
	planSummaryItem
	PrimarySKU *model.PlanSKU `json:"primary_sku,omitempty"`
}
'''
              new = '''type planCatalogItem struct {
	planSummaryItem
	TrafficBytes   int64          `json:"traffic_bytes"`
	SpeedLimitMbps int            `json:"speed_limit_mbps"`
	DeviceLimit    int            `json:"device_limit"`
	PrimarySKU     *model.PlanSKU `json:"primary_sku,omitempty"`
}
'''
              if source.count(old) != 1:
                  raise SystemExit('catalog response type not found')
              source = source.replace(old, new, 1)
          if 'TrafficBytes:    plan.TrafficBytes,' not in source:
              old = '''func newPlanCatalogItem(plan model.Plan, counts planSKUCountRow, primarySKU *model.PlanSKU) planCatalogItem {
	return planCatalogItem{
		planSummaryItem: newPlanSummaryItem(plan, counts),
		PrimarySKU:      primarySKU,
	}
}
'''
              new = '''func newPlanCatalogItem(plan model.Plan, counts planSKUCountRow, primarySKU *model.PlanSKU) planCatalogItem {
	return planCatalogItem{
		planSummaryItem: newPlanSummaryItem(plan, counts),
		TrafficBytes:    plan.TrafficBytes,
		SpeedLimitMbps:  plan.SpeedLimitMbps,
		DeviceLimit:     plan.DeviceLimit,
		PrimarySKU:      primarySKU,
	}
}
'''
              if source.count(old) != 1:
                  raise SystemExit('catalog response constructor not found')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cd backend
          gofmt -w internal/handler/handlers.go
          go test ./...
          go vet ./...
          go build ./cmd/zboard
      - name: Commit backend update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/handler/handlers.go
          git commit -m 'fix: expose plan entitlements in catalog'
          git push origin HEAD:feat/sku-operations

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/zboard

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI contract
        uses: docker://redocly/cli:1.34.3
        with:
          args: lint backend/api/openapi.yaml
