name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/zboard

  zrs-compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/zrs-compiler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Build release binary
        run: cargo build --release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test -- --no-file-parallelism
      - name: Typecheck and build
        run: pnpm build

  compose:
    runs-on: ubuntu-latest
    env:
      ZBOARD_IMAGE_TAG: v0.0.1-validation
      ZBOARD_DATA_SOURCE: zboard:validation@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=UTC
      ZBOARD_REDIS_ADDR: redis:6379
      ZBOARD_JWT_SECRET: 0123456789abcdef0123456789abcdef
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ZBOARD_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      ZBOARD_BOOTSTRAP_ADMIN_PASSWORD: validation-password-1234
      ZBOARD_EXTERNAL_NETWORK: validation-network
      ZBOARD_MYSQL_ROOT_PASSWORD: validation-root-password
      ZBOARD_MYSQL_PASSWORD: validation-db-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host directories
        run: sh deploy/docker/prepare-host-dirs.sh
      - name: Exercise nested bind permissions
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/deploy/docker/artifacts",target=/var/lib/zboard/artifacts,readonly \
            --mount type=bind,source="$PWD/deploy/docker/managed-rules",target=/var/lib/zboard/artifacts/rules \
            alpine:3.20 sh -c '
              if touch /var/lib/zboard/artifacts/.unexpected-write 2>/dev/null; then
                echo "trusted artifact root unexpectedly accepted a write" >&2
                exit 1
              fi
              touch /var/lib/zboard/artifacts/rules/.write-test
              rm /var/lib/zboard/artifacts/rules/.write-test
            '
      - name: Validate Compose configurations
        run: |
          docker compose -f deploy/docker/docker-compose.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.release.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.validation.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.blue-green.yml config >/dev/null
      - name: Verify managed rule mount contract
        run: |
          for file in \
            deploy/docker/docker-compose.yml \
            deploy/docker/docker-compose.release.yml \
            deploy/docker/docker-compose.validation.yml; do
            grep -q 'target: /var/lib/zboard/artifacts$' "$file"
            grep -q 'target: /var/lib/zboard/artifacts/rules$' "$file"
            grep -q 'source: ${ZBOARD_MANAGED_RULE_HOST_DIR:-./managed-rules}' "$file"
          done
          test "$(grep -c 'target: /var/lib/zboard/artifacts/rules$' deploy/docker/docker-compose.blue-green.yml)" -eq 2

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenAPI contract
        uses: docker://redocly/cli:1.34.3
        with:
          args: lint backend/api/openapi.yaml
