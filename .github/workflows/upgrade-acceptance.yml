            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/authority-restore-destination.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/authority-restore-observed.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/authority-restore-result.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/restore-destination.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/restore-observed.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/restore-result.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/old-source.db
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/current.db
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/current-source.db
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/restored-current.db
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/restored-old.db
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/old-source.sql
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-source.sql
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/old-dump.stderr
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-dump.stderr
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-copy-import.log
