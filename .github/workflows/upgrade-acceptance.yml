            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/authority-restore-result.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/restore-destination.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/restore-observed.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/sqlite/restore-result.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/driver-started.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/driver-final.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/old-ready.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-result.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-recovery.json
            ${{ runner.temp }}/zboard-upgrade-acceptance/upgrade-both-*/mysql/current-authority.json
