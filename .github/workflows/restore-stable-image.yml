name: Restore stable image channel

# One-time recovery for the prerelease published before latest=false was set.
# Exact digest guards make subsequent runs harmless and protect newer releases.
on:
  push:
    branches: [develop]
    paths: [.github/workflows/restore-stable-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: restore-zboard-stable-image
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'zerodenet/zboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/zerodenet/zboard
      # Published v0.0.1 at e1b7246, verified against its OCI revision label.
      STABLE: sha256:24d78f30aae750a3118e7c9fe1276fe41fb2bafebecf34f064f04568c2e0ab83
      MISLABELED: sha256:67cf5b7703f5b53cc9d7bb27a8a981e263e57280cb8b5b4df59700d05df862a0
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore only the known mislabeled manifest
        shell: bash
        run: |
          set -euo pipefail
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && !seen++ { print $2 }'
          }
          current="$(digest "${IMAGE}:latest")"
          echo "Current latest: $current; stable target: $STABLE"
          if [ "$current" = "$STABLE" ]; then
            echo "Stable image already restored."
            exit 0
          fi
          test "$current" = "$MISLABELED"
          test "$(digest "${IMAGE}:v0.0.1")" = "$STABLE"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${STABLE}"
          test "$(digest "${IMAGE}:latest")" = "$STABLE"
          echo "latest restored to the existing v0.0.1 manifest; no image was rebuilt."
