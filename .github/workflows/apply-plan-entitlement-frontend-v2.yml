name: apply-plan-entitlement-frontend-v2

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/sku-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Apply corrected frontend patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-plan-entitlement-frontend.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n          cd frontend"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          old = """    if count != 1:
        raise SystemExit(f'{label}: expected one match, found {count}')
    return source.replace(old, new, 1)
"""
          new = """    if count != 1:
        if label == 'SKU field map' and count == 2:
            index = source.rfind(old)
            return source[:index] + new + source[index + len(old):]
        raise SystemExit(f'{label}: expected one match, found {count}')
    return source.replace(old, new, 1)
"""
          if script.count(old) != 1:
              raise SystemExit('replace_once helper not found')
          Path('/tmp/apply_frontend.py').write_text(script.replace(old, new, 1))
          PY
          python /tmp/apply_frontend.py
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit frontend update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "fix: keep plan entitlements out of SKU forms"
          git push origin HEAD:feat/sku-operations
