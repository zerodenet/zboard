name: apply-commerce-invariants

on:
  push:
    branches:
      - feat/sku-operations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - name: Enforce purchasable SKU invariant
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          commerce = Path('backend/internal/handler/commerce_sku_operations.go')
          source = commerce.read_text()
          pattern = re.compile(
              r'\tnormalized\.SKU\.ID = existing\.ID\n'
              r'\tif !normalized\.SKU\.IsActive \{.*?'
              r'\n\t\}\n'
              r'\terr = h\.db\.Transaction',
              re.S,
          )
          replacement = '''\tnormalized.SKU.ID = existing.ID
\tvar plan model.Plan
\tif err := h.db.First(&plan, existing.PlanID).Error; err != nil {
\t\tServerError(w, err)
\t\treturn
\t}
\tif plan.IsActive && (!normalized.SKU.IsActive || !containsSKUOperation(normalized.AllowedOperations, skuOperationPurchase)) {
\t\tvar otherPurchasable int64
\t\tif err := h.db.Table("plan_skus").
\t\t\tJoins("JOIN plan_sku_operations ON plan_sku_operations.plan_sku_id = plan_skus.id AND plan_sku_operations.operation = ?", skuOperationPurchase).
\t\t\tWhere("plan_skus.plan_id = ? AND plan_skus.id <> ? AND plan_skus.is_active = ?", existing.PlanID, existing.ID, true).
\t\t\tCount(&otherPurchasable).Error; err != nil {
\t\t\tServerError(w, err)
\t\t\treturn
\t\t}
\t\tif otherPurchasable == 0 {
\t\t\tBadRequestFields(w, "销售规格校验失败。", map[string]string{"allowed_operations": "已发布商品必须保留至少一个允许新购的可售 SKU。"})
\t\t\treturn
\t\t}
\t}
\terr = h.db.Transaction'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'commerce SKU invariant replacement count = {count}')
          commerce.write_text(source)

          handlers = Path('backend/internal/handler/handlers.go')
          source = handlers.read_text()
          pattern = re.compile(
              r'\t\tvar activeSKUCount int64\n'
              r'\t\tif err := h\.db\.Model\(&model\.PlanSKU\{\}\)\.Where\("plan_id = \? AND is_active = \?", id, true\)\.Count\(&activeSKUCount\)\.Error; err != nil \|\| activeSKUCount == 0 \{\n'
              r'\t\t\tBadRequest\(w, "an active plan must have at least one active sku"\)\n'
              r'\t\t\treturn\n'
              r'\t\t\}\n',
          )
          replacement = '''\t\tvar activePurchaseSKUCount int64
\t\tif err := h.db.Table("plan_skus").
\t\t\tJoins("JOIN plan_sku_operations ON plan_sku_operations.plan_sku_id = plan_skus.id AND plan_sku_operations.operation = ?", skuOperationPurchase).
\t\t\tWhere("plan_skus.plan_id = ? AND plan_skus.is_active = ?", id, true).
\t\t\tCount(&activePurchaseSKUCount).Error; err != nil || activePurchaseSKUCount == 0 {
\t\t\tBadRequestFields(w, "商品信息校验失败。", map[string]string{"is_active": "已发布商品至少需要一个允许新购的可售 SKU。"})
\t\t\treturn
\t\t}
'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'plan publication invariant replacement count = {count}')
          handlers.write_text(source)
          PY
          cd backend && gofmt -w internal/handler/commerce_sku_operations.go internal/handler/handlers.go
      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/handler/commerce_sku_operations.go backend/internal/handler/handlers.go
          git commit -m "fix: preserve purchasable SKU for published plans"
          git push origin HEAD:feat/sku-operations
