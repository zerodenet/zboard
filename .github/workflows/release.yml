name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
      - name: Build binary
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/zerodenet/zboard/backend/internal/version.Version=${{ github.ref_name }} -X github.com/zerodenet/zboard/backend/internal/version.Commit=${{ github.sha }} -X github.com/zerodenet/zboard/backend/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/zboard ./cmd/zboard
      - name: Prepare image metadata
        run: echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --build-arg APP_COMMIT=${{ github.sha }} \
            --build-arg APP_BUILD_TIME=${APP_BUILD_TIME} \
            -t ghcr.io/zerodenet/zboard:${{ github.ref_name }} \
            -f deploy/docker/Dockerfile .
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push ghcr.io/zerodenet/zboard:${{ github.ref_name }}
