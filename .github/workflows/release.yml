name: release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ghcr.io/zerodenet/zboard

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare release metadata
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          prerelease=false
          if [[ "${tag}" == *-* ]]; then
            prerelease=true
          fi
          echo "APP_BUILD_TIME=${build_time}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=${prerelease}" >> "$GITHUB_ENV"
          echo "BINARY_ARCHIVE=zboard_${tag}_linux_amd64.tar.gz" >> "$GITHUB_ENV"
          echo "IMAGE_ARCHIVE=zboard_${tag}_linux_amd64-image.tar.gz" >> "$GITHUB_ENV"
      - name: Test backend
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
      - name: Build binary
        working-directory: backend
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/zerodenet/zboard/backend/internal/version.Version=${{ github.ref_name }} -X github.com/zerodenet/zboard/backend/internal/version.Commit=${{ github.sha }} -X github.com/zerodenet/zboard/backend/internal/version.BuildTime=${APP_BUILD_TIME}" \
            -o bin/zboard ./cmd/zboard
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          tar -C backend/bin -czf "dist/${BINARY_ARCHIVE}" zboard
          (cd dist && sha256sum "${BINARY_ARCHIVE}" > SHA256SUMS)
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}
      - name: Export image archive
        shell: bash
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker save "${IMAGE_NAME}:${GITHUB_REF_NAME}" | gzip -9 > "dist/${IMAGE_ARCHIVE}"
          (cd dist && sha256sum "${IMAGE_ARCHIVE}" >> SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/${{ env.BINARY_ARCHIVE }}
            dist/${{ env.IMAGE_ARCHIVE }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Generate release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "${previous_tag}" ]; then
            note_scope="${previous_tag}..${GITHUB_REF_NAME}"
            note_title="Changes since ${previous_tag}"
          else
            note_scope="${GITHUB_REF_NAME}"
            note_title="Changes in ${GITHUB_REF_NAME}"
          fi

          {
            printf '%s\n\n' "${note_title}"
            git log --no-merges --reverse --pretty=format:'- %s (%h)' "${note_scope}"
          } > dist/RELEASE_NOTES.md
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_args=()
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${BINARY_ARCHIVE}" \
            "dist/${IMAGE_ARCHIVE}" \
            "dist/SHA256SUMS" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            "${prerelease_args[@]}"
