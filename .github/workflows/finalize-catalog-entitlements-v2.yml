name: finalize-catalog-entitlements-v2

on:
  push:
    branches: [feat/sku-operations]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sku-operations
      - name: Replace catalog serializer with explicit DTO fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/internal/handler/handlers.go')
          source = path.read_text()
          source, type_count = re.subn(
              r'type planCatalogItem struct \{\n\tplanSummaryItem\n\tPrimarySKU \*model\.PlanSKU `json:"primary_sku,omitempty"`\n\}',
              'type planCatalogItem struct {\n\tplanSummaryItem\n\tTrafficBytes   int64          `json:"traffic_bytes"`\n\tSpeedLimitMbps int            `json:"speed_limit_mbps"`\n\tDeviceLimit    int            `json:"device_limit"`\n\tPrimarySKU     *model.PlanSKU `json:"primary_sku,omitempty"`\n}',
              source,
              count=1,
          )
          source, constructor_count = re.subn(
              r'func newPlanCatalogItem\(plan model\.Plan, counts planSKUCountRow, primarySKU \*model\.PlanSKU\) planCatalogItem \{\n\treturn planCatalogItem\{\n\t\tplanSummaryItem: newPlanSummaryItem\(plan, counts\),\n\t\tPrimarySKU:\s+primarySKU,\n\t\}\n\}',
              'func newPlanCatalogItem(plan model.Plan, counts planSKUCountRow, primarySKU *model.PlanSKU) planCatalogItem {\n\treturn planCatalogItem{\n\t\tplanSummaryItem: newPlanSummaryItem(plan, counts),\n\t\tTrafficBytes:    plan.TrafficBytes,\n\t\tSpeedLimitMbps:  plan.SpeedLimitMbps,\n\t\tDeviceLimit:     plan.DeviceLimit,\n\t\tPrimarySKU:      primarySKU,\n\t}\n}',
              source,
              count=1,
          )
          if type_count != 1 or constructor_count != 1:
              raise SystemExit(f'catalog replacements: type={type_count}, constructor={constructor_count}')
          path.write_text(source)
          PY
          rm -f \
            backend/internal/handler/commerce_catalog_json.go \
            backend/internal/handler/commerce_catalog_json_test.go \
            backend/internal/model/plan_sku_entitlement_hook.go
          git rm -f \
            .github/workflows/finalize-catalog-entitlements.yml \
            .github/workflows/finalize-catalog-entitlements-v2.yml
          cd backend
          gofmt -w internal/handler/handlers.go
      - name: Commit final DTO
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: expose plan entitlements through catalog DTO'
          git push origin HEAD:feat/sku-operations
