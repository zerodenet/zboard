name: Apply protocol endpoint effect classification

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/classify-protocol-endpoint-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply source changes
        run: |
          python3 scripts/apply-protocol-effects.py || true
          grep -q 'classifyProtocolEndpointChange(existingEffectSnapshot' backend/internal/handler/handlers.go
          grep -q 'Promise<ProtocolEndpointMutationResult>' frontend/src/api/client.ts
          grep -q 'protocolEndpointMutationMessage(result, creatingCopy)' frontend/src/views/Protocols.vue
          python3 scripts/patch-protocol-openapi.py
      - name: Format and test backend classification
        run: |
          gofmt -w backend/internal/handler/protocol_endpoint_effects.go backend/internal/handler/protocol_endpoint_effects_test.go backend/internal/handler/handlers.go
          cd backend
          go test ./internal/handler
      - name: Commit applied patch
        run: |
          rm scripts/apply-protocol-effects.py
          rm scripts/fix-protocol-effects-script.py
          rm scripts/patch-protocol-openapi.py
          rm .github/workflows/agent-apply-protocol-effects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: classify protocol endpoint change effects"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
