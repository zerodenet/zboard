name: Apply protocol endpoint effect classification

on:
  push:
    branches:
      - agent/classify-protocol-endpoint-effects

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classify-protocol-endpoint-effects
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          handlers_path = Path('backend/internal/handler/handlers.go')
          handlers = handlers_path.read_text()
          old_existing = '''\tvar existing model.ProtocolEndpoint
          \tif endpointID != 0 {
          \t\tif err := h.db.First(&existing, endpointID).Error; err != nil {
          \t\t\tNotFound(w)
          \t\t\treturn
          \t\t}
          \t}
          '''
          new_existing = '''\tvar existing model.ProtocolEndpoint
          \tvar existingEffectSnapshot *protocolEndpointEffectSnapshot
          \tvar existingManagedCertificateID uint
          \tif endpointID != 0 {
          \t\tif err := h.db.First(&existing, endpointID).Error; err != nil {
          \t\t\tNotFound(w)
          \t\t\treturn
          \t\t}
          \t\texistingServerConfig, decryptErr := h.credentialCipher.Decrypt(existing.ServerConfig)
          \t\tif decryptErr != nil {
          \t\t\tServerError(w, decryptErr)
          \t\t\treturn
          \t\t}
          \t\texistingClientConfig := existing.ClientConfig
          \t\tif !strings.EqualFold(existing.Protocol, "mieru") {
          \t\t\texistingServerConfig, existingClientConfig, err = normalizeManagedProtocolTemplates(existing.Protocol, existingServerConfig, existingClientConfig)
          \t\t\tif err != nil {
          \t\t\t\tServerError(w, err)
          \t\t\t\treturn
          \t\t\t}
          \t\t}
          \t\tmanagedCertificateIDs, loadErr := h.loadManagedCertificateIDsForEndpoints([]uint{existing.ID})
          \t\tif loadErr != nil {
          \t\t\tServerError(w, loadErr)
          \t\t\treturn
          \t\t}
          \t\tif managedCertificateID := managedCertificateIDs[existing.ID]; managedCertificateID != nil {
          \t\t\texistingManagedCertificateID = *managedCertificateID
          \t\t}
          \t\tsnapshot := protocolEndpointEffectSnapshot{
          \t\t\tNodeID: existing.NodeID, Name: existing.Name, Protocol: existing.Protocol, Address: existing.Address,
          \t\t\tPort: existing.Port, PublicPort: existing.PublicPort, Cipher: existing.Cipher,
          \t\t\tParentProtocolID: existing.ParentProtocolID, MultiplierMilli: existing.MultiplierMilli,
          \t\t\tServerConfig: existingServerConfig, ClientConfig: existingClientConfig,
          \t\t\tOptionalConfig: existing.OptionalConfig, Tags: existing.Tags,
          \t\t\tIsActive: existing.IsActive, SortOrder: existing.SortOrder,
          \t\t\tManagedCertificateID: existingManagedCertificateID,
          \t\t}
          \t\texistingEffectSnapshot = &snapshot
          \t}
          '''
          handlers = replace_once(handlers, old_existing, new_existing, 'load existing endpoint snapshot')

          old_encrypt = '''\tencryptedServerConfig, err := h.credentialCipher.Encrypt(req.Config)
          \tif err != nil {
          \t\tServerError(w, err)
          \t\treturn
          \t}
          '''
          new_encrypt = '''\tnextManagedCertificateID := uint(0)
          \tif managedCertificate != nil {
          \t\tnextManagedCertificateID = managedCertificate.ID
          \t}
          \tchangeEffects := classifyProtocolEndpointChange(existingEffectSnapshot, protocolEndpointEffectSnapshot{
          \t\tNodeID: node.ID, Name: req.Name, Protocol: protocol, Address: req.Address,
          \t\tPort: req.Port, PublicPort: req.PublicPort, Cipher: req.Cipher,
          \t\tParentProtocolID: req.ParentProtocolID, MultiplierMilli: req.MultiplierMilli,
          \t\tServerConfig: req.Config, ClientConfig: req.ClientConfig,
          \t\tOptionalConfig: normalizeOptionalJSON(req.OptionalConfig, "{}"),
          \t\tTags: normalizeOptionalJSON(req.Tags, "[]"), IsActive: isActive,
          \t\tSortOrder: req.SortOrder, ManagedCertificateID: nextManagedCertificateID,
          \t})

          \tencryptedServerConfig, err := h.credentialCipher.Encrypt(req.Config)
          \tif err != nil {
          \t\tServerError(w, err)
          \t\treturn
          \t}
          '''
          handlers = replace_once(handlers, old_encrypt, new_encrypt, 'classify before encryption')

          old_audit = '''\t\tif previousNodeID != 0 && previousNodeID != node.ID {
          \t\t\tdetail += fmt.Sprintf(" previous_node=%d", previousNodeID)
          \t\t}
          \t\treturn createAuditLog(tx, claims, action, fmt.Sprintf("protocol_endpoint:%d", endpoint.ID), detail)
          '''
          new_audit = '''\t\tif previousNodeID != 0 && previousNodeID != node.ID {
          \t\t\tdetail += fmt.Sprintf(" previous_node=%d", previousNodeID)
          \t\t}
          \t\tdetail += fmt.Sprintf(" effect=%s publish_status=%s", changeEffects.Effect, changeEffects.PublishStatus)
          \t\treturn createAuditLog(tx, claims, action, fmt.Sprintf("protocol_endpoint:%d", endpoint.ID), detail)
          '''
          handlers = replace_once(handlers, old_audit, new_audit, 'record effect in audit log')

          old_schedule = '''\tif previousNodeID != 0 && previousNodeID != node.ID {
          \t\th.scheduleNodeConfigPublish(previousNodeID, endpoint.ID, claims.UserID)
          \t}
          \th.scheduleNodeConfigPublish(node.ID, endpoint.ID, claims.UserID)
          \tOK(w, map[string]interface{}{"protocol_endpoint": endpoint, "publish_status": "queued"})
          '''
          new_schedule = '''\tfor _, affectedNodeID := range changeEffects.AffectedNodeIDs {
          \t\th.scheduleNodeConfigPublish(affectedNodeID, endpoint.ID, claims.UserID)
          \t}
          \tOK(w, protocolEndpointMutationResponse{
          \t\tProtocolEndpoint:              endpoint,
          \t\tprotocolEndpointChangeEffects: changeEffects,
          \t})
          '''
          handlers = replace_once(handlers, old_schedule, new_schedule, 'schedule only affected nodes')
          handlers_path.write_text(handlers)

          client_path = Path('frontend/src/api/client.ts')
          client = client_path.read_text()
          old_create = '''export async function createProtocolEndpoint(payload: any) {
            const response = await api.post('/admin/protocol-endpoints', payload)
            return unwrap(response)
          }
          '''
          new_create = '''export type ProtocolEndpointChangeEffect = 'none' | 'management' | 'billing' | 'delivery' | 'runtime' | 'credential_placement'

          export interface ProtocolEndpointMutationResult {
          \tprotocol_endpoint: Record<string, unknown>
          \teffect: ProtocolEndpointChangeEffect
          \teffects: ProtocolEndpointChangeEffect[]
          \tpublish_status: 'queued' | 'not_required'
          \taffected_node_ids: number[]
          }

          export async function createProtocolEndpoint(payload: any): Promise<ProtocolEndpointMutationResult> {
            const response = await api.post('/admin/protocol-endpoints', payload)
            return unwrap(response)
          }
          '''
          client = replace_once(client, old_create, new_create, 'type protocol create response')
          old_update = '''export async function updateProtocolEndpoint(id: number, payload: any) {
          \tconst response = await api.put(`/admin/protocol-endpoints/${id}`, payload)
          \treturn unwrap(response)
          }
          '''
          new_update = '''export async function updateProtocolEndpoint(id: number, payload: any): Promise<ProtocolEndpointMutationResult> {
          \tconst response = await api.put(`/admin/protocol-endpoints/${id}`, payload)
          \treturn unwrap(response)
          }
          '''
          client = replace_once(client, old_update, new_update, 'type protocol update response')
          client_path.write_text(client)

          protocols_path = Path('frontend/src/views/Protocols.vue')
          protocols = protocols_path.read_text()
          old_import = "import { isIntegerInRange } from '../utils/validation'\n"
          new_import = "import { protocolEndpointMutationMessage } from '../utils/protocolEndpointEffects'\nimport { isIntegerInRange } from '../utils/validation'\n"
          protocols = replace_once(protocols, old_import, new_import, 'import mutation message helper')
          old_save = '''    if (form.id) await updateProtocolEndpoint(form.id, payload); else await createProtocolEndpoint(payload)
              editorOpen.value = false
              copySourceID.value = 0
              message.value = creatingCopy ? '协议配置已复制为独立服务；可按需启用并发布。' : '协议服务已保存，完整配置正在自动发布；可在列表中查看结果。'
              await refresh()
          '''
          new_save = '''    const result = form.id ? await updateProtocolEndpoint(form.id, payload) : await createProtocolEndpoint(payload)
              editorOpen.value = false
              copySourceID.value = 0
              message.value = protocolEndpointMutationMessage(result, creatingCopy)
              await refresh()
          '''
          protocols = replace_once(protocols, old_save, new_save, 'show classified save result')
          protocols_path.write_text(protocols)

          openapi_path = Path('backend/api/openapi.yaml')
          openapi = openapi_path.read_text()

          def replace_success_response(document: str, route: str, method: str) -> str:
              route_marker = f"  {route}:\n"
              route_start = document.find(route_marker)
              if route_start < 0:
                  raise SystemExit(f"OpenAPI route not found: {route}")
              next_route = document.find('\n  /api/', route_start + len(route_marker))
              if next_route < 0:
                  next_route = len(document)
              block = document[route_start:next_route]
              method_marker = f"    {method}:\n"
              method_start = block.find(method_marker)
              if method_start < 0:
                  raise SystemExit(f"OpenAPI method not found: {method} {route}")
              following = re.search(r'^    (?:get|post|put|patch|delete):\n', block[method_start + len(method_marker):], re.M)
              method_end = method_start + len(method_marker) + following.start() if following else len(block)
              operation = block[method_start:method_end]
              response_pattern = re.compile(r'^        "200":\n.*?(?=^        "[0-9]{3}":|\Z)', re.M | re.S)
              replacement = '''        "200":
                    description: Protocol endpoint saved with classified change effects
                    content:
                      application/json:
                        schema:
                          allOf:
                            - $ref: "#/components/schemas/ApiResponse"
                            - properties:
                                data:
                                  $ref: "#/components/schemas/ProtocolEndpointMutationResult"
          '''
              operation, count = response_pattern.subn(replacement, operation, count=1)
              if count != 1:
                  raise SystemExit(f"OpenAPI 200 response not found: {method} {route}")
              block = block[:method_start] + operation + block[method_end:]
              return document[:route_start] + block + document[next_route:]

          openapi = replace_success_response(openapi, '/api/v1/admin/protocol-endpoints', 'post')
          openapi = replace_success_response(openapi, '/api/v1/admin/protocol-endpoints/{id}', 'put')

          schema_marker = re.search(r'^    ProtocolEndpointSelectionSnapshot:\n', openapi, re.M)
          if not schema_marker:
              raise SystemExit('OpenAPI ProtocolEndpointSelectionSnapshot schema not found')
          schema = '''    ProtocolEndpointChangeEffect:
                type: string
                enum: [none, management, billing, delivery, runtime, credential_placement]
              ProtocolEndpointMutationResult:
                type: object
                required: [protocol_endpoint, effect, effects, publish_status]
                properties:
                  protocol_endpoint:
                    $ref: "#/components/schemas/ProtocolEndpoint"
                  effect:
                    $ref: "#/components/schemas/ProtocolEndpointChangeEffect"
                  effects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProtocolEndpointChangeEffect"
                  publish_status:
                    type: string
                    enum: [queued, not_required]
                  affected_node_ids:
                    type: array
                    items: { type: integer, format: int64 }
          '''
          openapi = openapi[:schema_marker.start()] + schema + openapi[schema_marker.start():]
          openapi_path.write_text(openapi)
          PY
      - name: Format and test backend classification
        shell: bash
        run: |
          gofmt -w backend/internal/handler/protocol_endpoint_effects.go backend/internal/handler/protocol_endpoint_effects_test.go backend/internal/handler/handlers.go
          cd backend
          go test ./internal/handler
      - name: Commit applied patch
        shell: bash
        run: |
          rm .github/workflows/agent-apply-protocol-effects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend .github/workflows/agent-apply-protocol-effects.yml
          git commit -m "refactor: classify protocol endpoint change effects"
          git push origin HEAD:agent/classify-protocol-endpoint-effects
