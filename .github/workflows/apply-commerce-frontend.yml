name: apply-commerce-frontend

on:
  push:
    branches: [feat/commerce-purchase-experience]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-purchase-experience
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Complete commerce interactions
        run: |
          python .github/scripts/apply_commerce_frontend.py
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit completed frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-commerce-frontend.yml .github/scripts/apply_commerce_frontend.py
          git add frontend
          git commit -m "feat: complete product selection and checkout interactions"
          git push origin HEAD:feat/commerce-purchase-experience
