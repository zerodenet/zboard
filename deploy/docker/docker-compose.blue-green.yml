services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ZBOARD_MYSQL_ROOT_PASSWORD:?set ZBOARD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zboard
      MYSQL_USER: zboard
      MYSQL_PASSWORD: ${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7

  zboard-blue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - mysql
      - redis
    container_name: zboard-blue
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: "zboard:${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=Local"
      ZBOARD_REDIS_ADDR: redis:6379
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_BOOTSTRAP_ADMIN_USERNAME: ${ZBOARD_BOOTSTRAP_ADMIN_USERNAME:?set ZBOARD_BOOTSTRAP_ADMIN_USERNAME}
      ZBOARD_BOOTSTRAP_ADMIN_EMAIL: ${ZBOARD_BOOTSTRAP_ADMIN_EMAIL:?set ZBOARD_BOOTSTRAP_ADMIN_EMAIL}
      ZBOARD_BOOTSTRAP_ADMIN_PASSWORD: ${ZBOARD_BOOTSTRAP_ADMIN_PASSWORD:?set ZBOARD_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ../backend/etc/zboard.yaml.example:/app/etc/zboard.yaml:ro
    command: ["-f", "/app/etc/zboard.yaml"]
    restart: unless-stopped
    expose:
      - "8080"

  zboard-green:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - mysql
      - redis
    container_name: zboard-green
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: "zboard:${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=Local"
      ZBOARD_REDIS_ADDR: redis:6379
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_BOOTSTRAP_ADMIN_USERNAME: ${ZBOARD_BOOTSTRAP_ADMIN_USERNAME:?set ZBOARD_BOOTSTRAP_ADMIN_USERNAME}
      ZBOARD_BOOTSTRAP_ADMIN_EMAIL: ${ZBOARD_BOOTSTRAP_ADMIN_EMAIL:?set ZBOARD_BOOTSTRAP_ADMIN_EMAIL}
      ZBOARD_BOOTSTRAP_ADMIN_PASSWORD: ${ZBOARD_BOOTSTRAP_ADMIN_PASSWORD:?set ZBOARD_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ../backend/etc/zboard.yaml.example:/app/etc/zboard.yaml:ro
    command: ["-f", "/app/etc/zboard.yaml"]
    restart: unless-stopped
    expose:
      - "8080"
    profiles:
      - standby

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-blue-green.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - zboard-blue

volumes:
  mysql_data:
