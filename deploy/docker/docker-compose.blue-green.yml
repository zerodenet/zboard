services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ZBOARD_MYSQL_ROOT_PASSWORD:?set ZBOARD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zboard
      MYSQL_USER: zboard
      MYSQL_PASSWORD: ${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  zboard-blue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - mysql
    container_name: zboard-blue
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: "zboard:${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=Local"
      ZBOARD_DATABASE_MAX_OPEN_CONNECTIONS: ${ZBOARD_DATABASE_MAX_OPEN_CONNECTIONS:-8}
      ZBOARD_DATABASE_MAX_IDLE_CONNECTIONS: ${ZBOARD_DATABASE_MAX_IDLE_CONNECTIONS:-2}
      ZBOARD_DATABASE_CONNECTION_MAX_LIFETIME_SECONDS: ${ZBOARD_DATABASE_CONNECTION_MAX_LIFETIME_SECONDS:-3600}
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_ZERO_ARTIFACT_DIR: /var/lib/zboard/artifacts
      ZBOARD_ZERO_KERNEL_CONTRACT: ${ZBOARD_ZERO_KERNEL_CONTRACT:-legacy}
      ZBOARD_ZERO_LOCAL_VERSION: ${ZBOARD_ZERO_LOCAL_VERSION:-}
      ZBOARD_ZERO_EVENT_SPOOL_MODE: ${ZBOARD_ZERO_EVENT_SPOOL_MODE:-file}
      ZBOARD_ZERO_EVENT_SPOOL_DIR: /var/lib/zboard/zero-events
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ENABLED: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ENABLED:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ALGORITHM: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ALGORITHM:-zstd}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_LEVEL: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_LEVEL:-1}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_BLOCK_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_BLOCK_BYTES:-2097152}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_WORKERS: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_WORKERS:-1}
      ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES:-5368709120}
      ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO:-0.75}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO:-0.85}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO:-0.95}
      ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES:-536870912}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES:-268435456}
      ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES:-1073741824}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_ENABLED: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_ENABLED:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_FLOW_UPDATES: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_FLOW_UPDATES:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_NODE_STATS: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_NODE_STATS:-true}
    volumes:
      - ../backend/etc/zboard.yaml.example:/app/etc/zboard.yaml:ro
      - type: bind
        source: ${ZBOARD_ZERO_ARTIFACT_HOST_DIR:-./artifacts}
        target: /var/lib/zboard/artifacts
        read_only: true
      - type: bind
        source: ${ZBOARD_MANAGED_RULE_HOST_DIR:-./managed-rules}
        target: /var/lib/zboard/artifacts/rules
        read_only: false
      - type: bind
        source: ${ZBOARD_ZERO_EVENT_SPOOL_BLUE_HOST_DIR:-./zero-events-blue}
        target: /var/lib/zboard/zero-events
        read_only: false
    command: ["-f", "/app/etc/zboard.yaml"]
    restart: unless-stopped
    expose:
      - "8080"

  zboard-green:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - mysql
    container_name: zboard-green
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: "zboard:${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=Local"
      ZBOARD_DATABASE_MAX_OPEN_CONNECTIONS: ${ZBOARD_DATABASE_MAX_OPEN_CONNECTIONS:-8}
      ZBOARD_DATABASE_MAX_IDLE_CONNECTIONS: ${ZBOARD_DATABASE_MAX_IDLE_CONNECTIONS:-2}
      ZBOARD_DATABASE_CONNECTION_MAX_LIFETIME_SECONDS: ${ZBOARD_DATABASE_CONNECTION_MAX_LIFETIME_SECONDS:-3600}
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_ZERO_ARTIFACT_DIR: /var/lib/zboard/artifacts
      ZBOARD_ZERO_KERNEL_CONTRACT: ${ZBOARD_ZERO_KERNEL_CONTRACT:-legacy}
      ZBOARD_ZERO_LOCAL_VERSION: ${ZBOARD_ZERO_LOCAL_VERSION:-}
      ZBOARD_ZERO_EVENT_SPOOL_MODE: ${ZBOARD_ZERO_EVENT_SPOOL_MODE:-file}
      ZBOARD_ZERO_EVENT_SPOOL_DIR: /var/lib/zboard/zero-events
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ENABLED: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ENABLED:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ALGORITHM: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_ALGORITHM:-zstd}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_LEVEL: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_LEVEL:-1}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_BLOCK_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_BLOCK_BYTES:-2097152}
      ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_WORKERS: ${ZBOARD_ZERO_EVENT_SPOOL_COMPRESSION_WORKERS:-1}
      ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES:-5368709120}
      ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO:-0.75}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO:-0.85}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO:-0.95}
      ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES:-536870912}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES:-268435456}
      ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES:-1073741824}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_ENABLED: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_ENABLED:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_FLOW_UPDATES: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_FLOW_UPDATES:-true}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_NODE_STATS: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACTION_NODE_STATS:-true}
    volumes:
      - ../backend/etc/zboard.yaml.example:/app/etc/zboard.yaml:ro
      - type: bind
        source: ${ZBOARD_ZERO_ARTIFACT_HOST_DIR:-./artifacts}
        target: /var/lib/zboard/artifacts
        read_only: true
      - type: bind
        source: ${ZBOARD_MANAGED_RULE_HOST_DIR:-./managed-rules}
        target: /var/lib/zboard/artifacts/rules
        read_only: false
      - type: bind
        source: ${ZBOARD_ZERO_EVENT_SPOOL_GREEN_HOST_DIR:-./zero-events-green}
        target: /var/lib/zboard/zero-events
        read_only: false
    command: ["-f", "/app/etc/zboard.yaml"]
    restart: unless-stopped
    expose:
      - "8080"
    profiles:
      - standby

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-blue-green.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - zboard-blue

volumes:
  mysql_data:
