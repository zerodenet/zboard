services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ZBOARD_MYSQL_ROOT_PASSWORD:?set ZBOARD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zboard
      MYSQL_USER: zboard
      MYSQL_PASSWORD: ${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_VERSION: ${ZBOARD_VERSION:-v0.0.1}
        APP_COMMIT: ${ZBOARD_COMMIT:-working-tree}
        APP_BUILD_TIME: ${ZBOARD_BUILD_TIME:-1970-01-01T00:00:00Z}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: "zboard:${ZBOARD_MYSQL_PASSWORD:?set ZBOARD_MYSQL_PASSWORD}@tcp(mysql:3306)/zboard?charset=utf8mb4&parseTime=true&loc=Local"
      ZBOARD_REDIS_ADDR: redis:6379
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_ZERO_ARTIFACT_DIR: /var/lib/zboard/artifacts
      ZBOARD_ZERO_KERNEL_CONTRACT: ${ZBOARD_ZERO_KERNEL_CONTRACT:-legacy}
      ZBOARD_ZERO_LOCAL_VERSION: ${ZBOARD_ZERO_LOCAL_VERSION:-}
    volumes:
      - ${ZBOARD_ZERO_ARTIFACT_HOST_DIR:-./artifacts}:/var/lib/zboard/artifacts:ro
    ports:
      - "${ZBOARD_HTTP_BIND:-0.0.0.0}:${ZBOARD_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
