services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: zboard
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      - mysql
      - redis
    volumes:
      - ../backend/etc/zboard.yaml.example:/app/etc/zboard.yaml:ro
    ports:
      - "8080:8080"
    command: ["-f", "/app/etc/zboard.yaml"]
    restart: unless-stopped

volumes:
  mysql_data:
