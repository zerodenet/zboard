services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ZBOARD_MYSQL_ROOT_PASSWORD:-zboard-local-root-password}
      MYSQL_DATABASE: zboard
      MYSQL_USER: zboard
      MYSQL_PASSWORD: ${ZBOARD_MYSQL_PASSWORD:-zboard-local-db-password}
    ports:
      - "${ZBOARD_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${ZBOARD_MYSQL_ROOT_PASSWORD:-zboard-local-root-password}"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - zboard_mysql_development:/var/lib/mysql

volumes:
  zboard_mysql_development:
