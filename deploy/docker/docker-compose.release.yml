services:
  zboard:
    image: ${ZBOARD_IMAGE_REPOSITORY:-ghcr.io/zerodenet/zboard}:${ZBOARD_IMAGE_TAG:?set ZBOARD_IMAGE_TAG}
    platform: linux/amd64
    pull_policy: ${ZBOARD_PULL_POLICY:-missing}
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: ${ZBOARD_DATA_SOURCE:?set ZBOARD_DATA_SOURCE}
      ZBOARD_REDIS_ADDR: ${ZBOARD_REDIS_ADDR:?set ZBOARD_REDIS_ADDR}
      ZBOARD_REDIS_PASSWORD: ${ZBOARD_REDIS_PASSWORD:-}
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_BOOTSTRAP_ADMIN_EMAIL: ${ZBOARD_BOOTSTRAP_ADMIN_EMAIL:-}
      ZBOARD_BOOTSTRAP_ADMIN_PASSWORD: ${ZBOARD_BOOTSTRAP_ADMIN_PASSWORD:-}
      ZBOARD_ZERO_ARTIFACT_DIR: /var/lib/zboard/artifacts
      ZBOARD_ZERO_KERNEL_CONTRACT: ${ZBOARD_ZERO_KERNEL_CONTRACT:-legacy}
      ZBOARD_ZERO_LOCAL_VERSION: ${ZBOARD_ZERO_LOCAL_VERSION:-}
    volumes:
      - type: bind
        source: ${ZBOARD_ZERO_ARTIFACT_HOST_DIR:-./artifacts}
        target: /var/lib/zboard/artifacts
        read_only: true
    ports:
      - "${ZBOARD_HTTP_BIND:-127.0.0.1}:${ZBOARD_HTTP_PORT:-8080}:8080"
    networks:
      - external_services
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  external_services:
    external: true
    name: ${ZBOARD_EXTERNAL_NETWORK:?set ZBOARD_EXTERNAL_NETWORK}
