services:
  zboard:
    image: ${ZBOARD_IMAGE_REPOSITORY:-ghcr.io/zerodenet/zboard}:${ZBOARD_IMAGE_TAG:?set ZBOARD_IMAGE_TAG}
    platform: linux/amd64
    pull_policy: ${ZBOARD_PULL_POLICY:-missing}
    environment:
      ZBOARD_ENVIRONMENT: production
      ZBOARD_DATA_SOURCE: ${ZBOARD_DATA_SOURCE:?set ZBOARD_DATA_SOURCE}
      ZBOARD_REDIS_ADDR: ${ZBOARD_REDIS_ADDR:?set ZBOARD_REDIS_ADDR}
      ZBOARD_REDIS_PASSWORD: ${ZBOARD_REDIS_PASSWORD:-}
      ZBOARD_JWT_SECRET: ${ZBOARD_JWT_SECRET:?set ZBOARD_JWT_SECRET}
      ZBOARD_CREDENTIAL_ENCRYPTION_KEY: ${ZBOARD_CREDENTIAL_ENCRYPTION_KEY:?set ZBOARD_CREDENTIAL_ENCRYPTION_KEY}
      ZBOARD_BOOTSTRAP_ADMIN_EMAIL: ${ZBOARD_BOOTSTRAP_ADMIN_EMAIL:-}
      ZBOARD_BOOTSTRAP_ADMIN_PASSWORD: ${ZBOARD_BOOTSTRAP_ADMIN_PASSWORD:-}
      ZBOARD_ZERO_ARTIFACT_DIR: /var/lib/zboard/artifacts
      ZBOARD_ZERO_KERNEL_CONTRACT: ${ZBOARD_ZERO_KERNEL_CONTRACT:-legacy}
      ZBOARD_ZERO_LOCAL_VERSION: ${ZBOARD_ZERO_LOCAL_VERSION:-}
      ZBOARD_ZERO_EVENT_SPOOL_MODE: ${ZBOARD_ZERO_EVENT_SPOOL_MODE:-file}
      ZBOARD_ZERO_EVENT_SPOOL_DIR: /var/lib/zboard/zero-events
      ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MAX_BYTES:-5368709120}
      ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_WARNING_RATIO:-0.75}
      ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_COMPACT_RATIO:-0.85}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RATIO:-0.95}
      ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_MIN_FREE_BYTES:-536870912}
      ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_EMERGENCY_RESERVE_BYTES:-268435456}
      ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES: ${ZBOARD_ZERO_EVENT_SPOOL_CRITICAL_RESERVE_BYTES:-1073741824}
    volumes:
      - type: bind
        source: ${ZBOARD_ZERO_ARTIFACT_HOST_DIR:-./artifacts}
        target: /var/lib/zboard/artifacts
        read_only: true
      - type: bind
        source: ${ZBOARD_MANAGED_RULE_HOST_DIR:-./managed-rules}
        target: /var/lib/zboard/artifacts/rules
        read_only: false
      - type: bind
        source: ${ZBOARD_ZERO_EVENT_SPOOL_HOST_DIR:-./zero-events}
        target: /var/lib/zboard/zero-events
        read_only: false
    ports:
      - "${ZBOARD_HTTP_BIND:-127.0.0.1}:${ZBOARD_HTTP_PORT:-8080}:8080"
    networks:
      - external_services
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  external_services:
    external: true
    name: ${ZBOARD_EXTERNAL_NETWORK:?set ZBOARD_EXTERNAL_NETWORK}