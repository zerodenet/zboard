syntax = "proto3";
package zboard.plugin.v1;
option go_package = "github.com/zerodenet/zboard/backend/pkg/pluginapi/v1;pluginv1";

// No generic host command, SQL, node or credential service is exposed here.
service PluginControl {
 rpc GetInfo(Empty) returns (Info);
 rpc Health(Empty) returns (HealthResult);
 // Optional safe configuration projection; secrets must be omitted.
 rpc DescribeConfig(ConfigRequest) returns (ConfigResult);
 rpc ValidateConfig(ConfigRequest) returns (ConfigResult);
 rpc ApplyConfig(ConfigRequest) returns (HealthResult);
 rpc TestConfig(ConfigRequest) returns (HealthResult);
 // Requires zboard.identity.provider.v1. Host owns redirects, state and sessions.
 rpc ListIdentityProviders(Empty) returns (IdentityProviderList);
 rpc GetIdentityProvider(IdentityProviderRequest) returns (IdentityProvider);
 rpc ExchangeIdentity(IdentityExchange) returns (VerifiedIdentity);
 // Optional zboard.task.v1: only signed, admitted manifest task IDs are dispatched.
 rpc RunTask(TaskRunRequest) returns (TaskRunResult);
 // Requires zboard.dns.provider.v1. Credentials are scoped to one provider
 // account invocation and never persisted by the host protocol.
 rpc VerifyDNSCredential(DNSCredentialRequest) returns (HealthResult);
 rpc ApplyDNSRecord(DNSApplyRequest) returns (DNSApplyResult);
 // Requires zboard.certificate.provider.v1. The private key remains on the
 // target node; the plugin receives only its signed CSR.
 rpc VerifyCertificateCredential(CertificateCredentialRequest) returns (HealthResult);
 rpc IssueCertificate(CertificateIssueRequest) returns (CertificateIssueResult);
 // Requires zboard.http.route.v1. The host dispatches only exact signed-manifest routes.
 rpc HandleHTTP(HTTPRequest) returns (HTTPResponse);
 // Optional action surface for the plugin's own authenticated business page.
 // The host supplies an opaque actor ID and never exposes its login token.
 rpc HandlePageAction(PageActionRequest) returns (PageActionResponse);
}
message Empty {}
message Info { string id = 1; string version = 2; uint32 protocol = 3; repeated string capabilities = 4; }
message ConfigRequest { bytes config_json = 1; uint64 revision = 2; bytes previous_config_json = 3; }
message ConfigResult { bytes normalized_json = 1; }
message HealthResult { bool healthy = 1; string message = 2; }

message IdentityProviderRequest { string provider_id = 1; }
message IdentityProviderOption { string id = 1; string name = 2; }
message IdentityProviderList { repeated IdentityProviderOption providers = 1; }
message IdentityProvider {
 string issuer = 1;
 string authorization_endpoint = 2;
 string client_id = 3;
 repeated string scopes = 4;
 string provider_id = 5;
 string protocol = 6;
}
message IdentityExchange {
 string code = 1;
 string redirect_uri = 2;
 string nonce = 3;
 string pkce_verifier = 4;
 string issuer = 5;
 string provider_id = 6;
}
// An assertion only: it does not carry user IDs, permissions or host commands.
message VerifiedIdentity {
 string issuer = 1;
 string subject = 2;
 string email = 3;
 bool email_verified = 4;
}
// run_id is an observation identity, not a guarantee of exactly-once delivery.
message TaskRunRequest {
 string task_id = 1;
 string run_id = 2;
 uint64 generation = 3;
 uint64 config_revision = 4;
}
message TaskRunResult { bool succeeded = 1; }

message DNSCredentialRequest {
 string provider_key = 1;
 bytes credential = 2;
 uint64 generation = 3;
 uint64 config_revision = 4;
}
message DNSApplyRequest {
 string provider_key = 1;
 bytes credential = 2;
 string record_type = 3;
 string name = 4;
 string value = 5;
 int32 ttl = 6;
 bool proxied = 7;
 string provider_zone_id = 8;
 string provider_record_id = 9;
 bool takeover = 10;
 uint64 generation = 11;
 uint64 config_revision = 12;
}
message DNSApplyResult {
 string zone_id = 1;
 string record_id = 2;
 string record_type = 3;
 string name = 4;
 string value = 5;
 int32 ttl = 6;
 bool proxied = 7;
}
message CertificateCredentialRequest {
 string provider_key = 1;
 bytes credential = 2;
 uint64 generation = 3;
 uint64 config_revision = 4;
}
message CertificateIssueRequest {
 string provider_key = 1;
 bytes credential = 2;
 bytes csr_pem = 3;
 repeated string domains = 4;
 string contact_email = 5;
 string environment = 6;
 bool renewal = 7;
 string operation_id = 8;
 uint64 generation = 9;
 uint64 config_revision = 10;
}
message CertificateIssueResult { bytes fullchain_pem = 1; }
message HTTPRequest {
 string route_id = 1;
 string method = 2;
 string path = 3;
 string content_type = 4;
 bytes body = 5;
}
message HTTPResponse {
 uint32 status = 1;
 string content_type = 2;
 bytes body = 3;
 int64 retry_after = 4;
}
message PageActionRequest {
 string page_id = 1;
 string surface = 2;
 string actor_id = 3;
 bool actor_admin = 4;
 string action = 5;
 bytes payload_json = 6;
}
message PageActionResponse { bytes result_json = 1; }
