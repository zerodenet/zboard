              type: array
              items: { $ref: "#/components/schemas/AdminTaskItem" }
    AdminTaskDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTask"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminTaskItem" }
    NodeBatchFilters:
