          required: [config, usage, kernel_supported, node_group_memberships]
          properties:
            config: { type: string, description: Decrypted administrator-only server configuration. }
            managed_certificate_id: { type: integer, format: int64, nullable: true }
            latest_deployment: { $ref: "#/components/schemas/ProtocolDeployment" }
            usage: { type: object }
            node_group_memberships:
              type: array
              items: { $ref: "#/components/schemas/ProtocolEndpointNodeGroupMembership" }
    ProtocolDeploymentSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [running, succeeded, failed] }
        has_error: { type: boolean }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ProtocolEndpointSummary:
      type: object
      required: [id, node_id, name, protocol, address, port, public_port, multiplier_milli, managed_principal_ready, mieru_principal_ready, kernel_supported, is_active, usage]
      properties:
        id: { type: integer, format: int64 }
        node_id: { type: integer, format: int64 }
        node_name: { type: string }
        name: { type: string }
        protocol: { type: string }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        public_port: { type: integer, minimum: 1, maximum: 65535 }
        parent_protocol_id: { type: integer, format: int64, nullable: true }
        multiplier_milli: { type: integer, minimum: 1, maximum: 100000 }
        managed_principal_ready:
          type: boolean
          description: True only after a Trojan or Hysteria2 managed-principal Zero generation has passed validation, activation, health and Connector confirmation.
        mieru_principal_ready:
          type: boolean
          description: True only after a Mieru principal-aware Zero generation has passed validation, activation, health and Connector confirmation.
        kernel_supported:
          type: boolean
          description: False when the endpoint protocol cannot be safely used by the active Zero kernel contract.
        kernel_unsupported_reason:
          type: string
          description: Operator-facing reason for an unavailable retained endpoint.
        is_active: { type: boolean }
        sort_order: { type: integer }
        latest_deployment: { $ref: "#/components/schemas/ProtocolDeploymentSummary" }
        usage:
          type: object
          properties:
            active_flows: { type: integer, format: int64, minimum: 0 }
            active_users: { type: integer, format: int64, minimum: 0, description: Distinct users with an active Zero flow seen during the two-minute activity window. }
            active_credentials: { type: integer, format: int64, minimum: 0 }
            last_used_at: { type: string, format: date-time, nullable: true }
            used_bytes_today: { type: integer, format: int64, minimum: 0 }
            used_bytes_total: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProtocolEndpointOrderItem:
      type: object
      required: [id, node_id, name, protocol, is_active, sort_order]
      properties:
        id: { type: integer, format: int64 }
        node_id: { type: integer, format: int64 }
        name: { type: string }
        protocol: { type: string }
        is_active: { type: boolean }
        sort_order: { type: integer }
    ProtocolEndpointOrderSnapshot:
      type: object
      required: [items, version, total]
      properties:
        items:
          type: array
          description: Every current protocol endpoint in global delivery order. The list is never filtered or paginated.
          items: { $ref: "#/components/schemas/ProtocolEndpointOrderItem" }
        version:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Optimistic hash of endpoint membership and persisted delivery positions.
        total: { type: integer, minimum: 0 }
    ProtocolEndpointOrderRequest:
      type: object
      required: [ordered_ids, expected_version]
      properties:
        ordered_ids:
          type: array
          minItems: 0
          uniqueItems: true
          description: Every current protocol endpoint ID exactly once, in the desired global client-delivery order.
          items: { type: integer, format: int64, minimum: 1 }
        expected_version:
          type: string
          pattern: "^[a-f0-9]{64}$"
    ProtocolEndpointOrderMutationResult:
      allOf:
        - $ref: "#/components/schemas/ProtocolEndpointOrderSnapshot"
        - type: object
          required: [effect, publish_status]
          properties:
            effect: { type: string, enum: [delivery] }
            publish_status: { type: string, enum: [not_required] }
    ProtocolEndpointChangeEffect:
      type: string
      enum: [none, management, billing, delivery, runtime, credential_placement]
    ProtocolEndpointMutationResult:
      type: object
      required: [protocol_endpoint, effect, effects, publish_status, node_group_memberships]
      properties:
        protocol_endpoint:
          $ref: "#/components/schemas/ProtocolEndpoint"
