              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AccountProtocolLoadSnapshot" }
  /api/v1/client/subscription/{token}:
    get:
      tags:
        - subscriptions
      summary: Fetch a client-specific subscription response
      description: When template is omitted or set to auto, the server selects the built-in ZNet Sink, Clash/Mihomo or sing-box template from User-Agent and falls back to the canonical zboard.subscription/v1 manifest. ZNet Sink and native JSON are delivered as Base64 text; Clash and sing-box retain their client-native representations. An explicit template slug or native always takes precedence over User-Agent.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: query
          name: template
          required: false
          description: Active operator-managed template slug, auto, or native. Omit for User-Agent auto detection; use native to force the Base64-encoded canonical zboard.subscription/v1 manifest.
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      responses:
        "200":
          description: Client subscription manifest and Subscription-Userinfo header
          headers:
            Subscription-Userinfo:
              description: Aggregate traffic and expiry metadata in upload=BYTES; download=BYTES; total=BYTES; expire=UNIX_SECONDS form.
              schema: { type: string }
            X-Zboard-Subscription-Format:
              description: Effective response format after explicit selection or User-Agent detection.
              schema: { type: string }
            Vary:
              description: Includes User-Agent when the response format was selected automatically.
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Error"
        "302":
          description: Invalid or revoked public subscription token redirected to the configured camouflage target without caching.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Cache-Control:
              schema: { type: string, example: no-store }
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/subscription-templates:
    get:
      tags: [subscriptions]
      summary: List active subscription export templates available to the current user
      description: Set paged=true to search a bounded metadata page. The legacy array response remains available for compatibility.
      parameters:
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope. }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Search name, slug or description." }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Active template metadata without template source
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/SubscriptionTemplate" }
                          - $ref: "#/components/schemas/SubscriptionTemplatePage"
  /api/v1/admin/subscription-rule-sets:
    get:
      tags: [subscriptions, admin]
      summary: List reusable subscription rule sets
      description: Returns a bounded metadata page. Templates reference these records by ID; inline remote entries remain available as a template-only shortcut.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Search name, tag, description or URL." }
        - { name: renderer, in: query, schema: { type: string, enum: [znet-sink, clash, sing-box] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: id, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Resolve one selected item. }
        - { name: ids, in: query, schema: { type: string }, description: Resolve up to 64 comma-separated selected IDs. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Reusable rule-set page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/SubscriptionRuleSetPage" }
    post:
      tags: [subscriptions, admin]
      summary: Create a reusable remote subscription rule set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRuleSetWriteRequest" }
      responses:
        "200": { description: Rule set created }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-rule-sets/{id}:
    get:
      tags: [subscriptions, admin]
      summary: Read one reusable subscription rule set
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Rule-set detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/SubscriptionRuleSet" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [subscriptions, admin]
      summary: Update a reusable subscription rule set
      description: Renderer changes are rejected while templates reference the rule set. Source changes apply to every reference.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRuleSetWriteRequest" }
      responses:
        "200": { description: Rule set updated }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [subscriptions, admin]
      summary: Delete an unused reusable subscription rule set
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Rule set deleted }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-templates:
    get:
      tags: [subscriptions, admin]
      summary: List subscription export templates
