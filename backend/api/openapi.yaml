        - { name: paged, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque bidirectional history cursor returned by page.next_cursor or page.previous_cursor. }
        - { name: from, in: query, schema: { type: string }, description: Inclusive start as YYYY-MM-DD or RFC3339. Defaults to the last 7 UTC days. }
        - { name: to, in: query, schema: { type: string }, description: Inclusive date or exclusive RFC3339 boundary. }
