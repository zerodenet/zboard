      responses:
        "200":
          description: User-scoped order list or page when paged=true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/Order" }
                          - $ref: "#/components/schemas/OrderPage"
    post:
      tags:
        - orders
      summary: Create order for plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders:
    get:
      tags: [orders, admin]
      summary: List orders across all users
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 128 }, description: "Match order/provider trade number, plan, SKU, channel or a numeric order/user/subscription ID." }
        - { name: status, in: query, schema: { type: string, enum: [attention, pending, paid, failed, canceled, success] }, description: "Use attention for the administrator work queue containing pending and failed orders." }
        - { name: order_type, in: query, schema: { type: string, enum: [new, renewal, upgrade, traffic_pack] } }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: created_from, in: query, schema: { type: string, format: date }, description: "Inclusive order creation start date. Must be paired with created_to; the window cannot exceed 366 days." }
        - { name: created_to, in: query, schema: { type: string, format: date }, description: "Inclusive order creation end date. Must be paired with created_from." }
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope instead of the legacy array. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Global order list or page when paged=true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/Order" }
                          - $ref: "#/components/schemas/OrderPage"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/orders/{id}:
    get:
      tags: [orders, admin]
      summary: Get a safe transaction and fulfillment snapshot
      description: Payment callback bodies are never returned. Provider references and normalized failure diagnostics are detail-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminOrderDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/orders/{id}/payment-events:
    get:
      tags: [orders, admin]
      summary: List normalized payment-event summaries for an order
      description: Callback payload bodies are never returned. Results contain only bounded processing metadata and provider references.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Paginated safe payment-event summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/PaymentEventPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{id}/pay-callback:
    post:
      tags:
        - orders
      summary: Apply an admin-authenticated payment result
      description: |
        Locks the order before applying the result. Repeating the same result is idempotent and never
        renews a subscription twice. Paid orders cannot transition back to failed or canceled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCallbackRequest"
      responses:
        "200":
          description: Order + subscription state after callback
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders/{id}/pay:
    post:
      tags:
        - orders
      summary: Confirm a pending order as paid
      description: Admin-only manual settlement endpoint. Normal users cannot mark their own orders as paid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Admin-only reconciliation flag allowing recovery of a canceled order; this endpoint is never available to normal users.
      responses:
        "200":
          description: Order paid and subscription applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - orders
      summary: Cancel pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Order canceled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders/{id}/cancel:
    post:
      tags: [orders, admin]
      summary: Cancel an order as an administrator
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: force, in: query, schema: { type: boolean }, description: Reconciliation flag. Paid orders remain terminal and cannot be canceled. }
      responses:
        "200": { description: Order canceled }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/subscriptions:
    get:
