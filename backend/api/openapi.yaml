                      data: { $ref: "#/components/schemas/TicketDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets/{id}/messages:
    post:
      tags: [tickets, admin]
      summary: Reply to a ticket as an administrator
      description: An administrator reply moves the ticket to pending_user. Closed tickets reject replies.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets/{id}/status:
    put:
      tags: [tickets, admin]
      summary: Change ticket status as an administrator
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      tags:
        - admin
      summary: List users
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: is_admin
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope instead of the legacy array. }
        - { name: sort, in: query, schema: { type: string, enum: [id, email, created_at], default: created_at } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/User" }
                          - $ref: "#/components/schemas/UserPage"
    post:
      tags:
        - admin
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateRequest"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/admin/users/{id}:
    get:
      tags: [admin]
      summary: Get a user account and bounded business counts
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: User account detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUserDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags:
        - admin
      summary: Update user fields
      parameters:
        - name: id
          in: path
