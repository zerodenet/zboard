                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/Subscription" }
                          - $ref: "#/components/schemas/SubscriptionPage"
  /api/v1/admin/subscriptions:
    get:
      tags: [subscriptions, admin]
      summary: List subscriptions across all users
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 128 }, description: "Match user email, plan, SKU or a numeric subscription/user/plan ID." }
        - { name: status, in: query, schema: { type: string, enum: [active, expired, canceled] } }
        - { name: quota, in: query, schema: { type: string, enum: [available, exhausted] } }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: expires_from, in: query, schema: { type: string, format: date }, description: "Inclusive subscription expiration start date. Must be paired with expires_to; the window cannot exceed 366 days." }
        - { name: expires_to, in: query, schema: { type: string, format: date }, description: "Inclusive subscription expiration end date. Must be paired with expires_from." }
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope instead of the legacy array. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Global subscription list or page when paged=true
          content:
