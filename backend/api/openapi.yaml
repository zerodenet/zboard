        name: { type: string }
        code: { type: string }
        description: { type: string }
        is_enabled: { type: boolean }
        revision: { type: integer, format: int64, minimum: 1, description: Node-group optimistic concurrency version captured when the endpoint editor loaded the relationship. }
        sort_order: { type: integer, minimum: 0, description: This endpoint's delivery position inside the node group. Endpoint-centric membership changes never rewrite existing positions. }
    ProtocolEndpointNodeGroupMembershipChange:
      type: object
      required: [node_group_id, expected_revision, member]
      properties:
        node_group_id: { type: integer, format: int64, minimum: 1 }
