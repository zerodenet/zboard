          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        all_matching: { type: boolean, default: false }
        filters: { $ref: "#/components/schemas/NodeBatchFilters" }
        idempotency_key: { type: string, maxLength: 128 }
    ProtocolBatchFilters:
      type: object
      properties:
        q: { type: string, maxLength: 100 }
