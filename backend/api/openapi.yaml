        removed_node_group_ids:
          type: array
          items: { type: integer, format: int64 }
        affected_node_ids:
          type: array
          description: Nodes published after credential reconciliation. Empty when no active subscription credential set can change.
          items: { type: integer, format: int64 }
        publish_status: { type: string, enum: [queued, not_required] }
        reconcile_tasks:
          type: array
          items: { $ref: "#/components/schemas/AdminTask" }
    ProtocolEndpointAdminDetail:
      allOf:
        - $ref: "#/components/schemas/ProtocolEndpoint"
