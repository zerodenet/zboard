        - { name: from, in: query, schema: { type: string }, description: Inclusive start as YYYY-MM-DD or RFC3339. Defaults to the last 30 UTC days. }
        - { name: to, in: query, schema: { type: string }, description: Inclusive date or exclusive RFC3339 boundary. }
        - { name: offset, in: query, deprecated: true, schema: { type: integer, minimum: 0, default: 0 }, description: Legacy compatibility only; cursor navigation is preferred. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Paginated merged operation records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/OperationLogPage" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/operation-logs/{source}/{id}:
    get:
      tags: [admin]
      summary: Read one persisted operation result including normalized output and error bodies
      parameters:
        - { name: source, in: path, required: true, schema: { type: string, enum: [protocol_publish, node_kernel, task] } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Operation detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/OperationLogDetail" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    NodeConnectorBearer:
      type: http
      scheme: bearer
      bearerFormat: ZeroNodeAPIKey
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          $ref: "#/components/schemas/ApiErrorDetail"
        timestamp:
          type: string
    ApiErrorDetail:
      type: object
      description: Versioned machine-readable detail included on HTTP error responses. The top-level message remains for backward compatibility.
      required: [version, code]
      properties:
        version:
          type: integer
          enum: [1]
        code:
          type: string
          example: validation_failed
        fields:
          type: object
          description: Field-path to localized actionable message. Present when code is validation_failed.
          additionalProperties:
            type: string
    PageMetadata:
      type: object
      required: [offset, limit, total, next_cursor, previous_cursor]
      properties:
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        total: { type: integer, format: int64, minimum: 0 }
        next_cursor: { type: string, nullable: true }
        previous_cursor: { type: string, nullable: true }
    PageEnvelope:
      type: object
      required: [page, aggregates, facets]
      properties:
        page: { $ref: "#/components/schemas/PageMetadata" }
        aggregates: { type: object, additionalProperties: true }
        facets: { type: object, additionalProperties: true }
        total: { type: integer, format: int64, minimum: 0, deprecated: true, description: Compatibility alias for page.total. }
        offset: { type: integer, minimum: 0, deprecated: true, description: Compatibility alias for page.offset. }
        limit: { type: integer, minimum: 1, maximum: 200, deprecated: true, description: Compatibility alias for page.limit. }
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        is_admin:
          type: boolean
        status:
          type: string
    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            account_name: { type: string }
            email_verified_at: { type: string, format: date-time, nullable: true }
            last_login_at: { type: string, format: date-time, nullable: true }
            active_subscription_count: { type: integer, format: int64 }
            total_subscription_count: { type: integer, format: int64 }
            pending_order_count: { type: integer, format: int64 }
            total_order_count: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AdminUserListItem:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [active_subscription_count, total_subscription_count, pending_order_count, total_order_count, created_at]
          properties:
            active_subscription_count: { type: integer, format: int64, minimum: 0 }
            total_subscription_count: { type: integer, format: int64, minimum: 0 }
            pending_order_count: { type: integer, format: int64, minimum: 0 }
            total_order_count: { type: integer, format: int64, minimum: 0 }
            created_at: { type: string, format: date-time }
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminUserListItem" }
    TicketStatus:
      type: string
      enum: [open, pending_admin, pending_user, resolved, closed]
    TicketCategory:
      type: string
      enum: [connection, billing, account, other]
    TicketCreateRequest:
      type: object
      required: [subject, category, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 160 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { type: integer, enum: [1, 2], default: 1 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    TicketReplyRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    TicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
    Ticket:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ticket_no: { type: string }
        user_id: { type: integer, format: int64 }
        user_email: { type: string, format: email }
        subject: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { type: integer, enum: [1, 2] }
        status: { $ref: "#/components/schemas/TicketStatus" }
        message_count: { type: integer, format: int64 }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Ticket" }
    TicketMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ticket_id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64, nullable: true }
        author_role: { type: string, enum: [user, admin, system] }
        author_email: { type: string }
        type: { type: string, enum: [message, status] }
        body: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        created_at: { type: string, format: date-time }
    TicketDetail:
      type: object
      required: [ticket, messages, has_older_messages]
      properties:
        ticket: { $ref: "#/components/schemas/Ticket" }
        messages:
          type: array
          description: Chronological page containing at most 100 messages.
          items: { $ref: "#/components/schemas/TicketMessage" }
        has_older_messages: { type: boolean }
        oldest_message_id: { type: integer, format: int64 }
    SystemConfigInputOption:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    SystemConfigInput:
      type: object
      required: [control]
      properties:
        control:
          type: string
          enum: [text, textarea, url, email, hostname, password, integer, port, switch, select, json]
        required: { type: boolean, default: false }
        min: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
        step: { type: integer, format: int64 }
        max_bytes: { type: integer, minimum: 1 }
        placeholder: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/SystemConfigInputOption" }
    SystemConfig:
      type: object
      required: [id, config_key, name, value_type, is_public, is_secret, configured, revision, input]
      properties:
        id: { type: integer, format: int64 }
        config_key: { type: string }
        name: { type: string }
        value:
          description: Omitted for secret configuration.
          oneOf:
            - { type: string }
            - { type: boolean }
            - { type: integer, format: int64 }
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
        value_type: { type: string, enum: [string, bool, int, json] }
        description: { type: string }
        is_public: { type: boolean }
        is_secret: { type: boolean }
        configured: { type: boolean }
        revision: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        input: { $ref: "#/components/schemas/SystemConfigInput" }
    SystemConfigUpdateRequest:
      type: object
      required: [value]
      properties:
        value:
          description: Must match the existing configuration value_type.
          oneOf:
            - { type: string }
            - { type: boolean }
            - { type: integer, format: int64 }
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    AdminTaskScope:
      type: object
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        subscription_ids:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        all_active: { type: boolean, default: false }
    AdminTaskCreateRequest:
      type: object
      required: [type, scope, content]
      properties:
        type: { type: string, enum: [quota, email] }
        scope: { $ref: "#/components/schemas/AdminTaskScope" }
        content:
          oneOf:
            - $ref: "#/components/schemas/QuotaTaskContent"
            - $ref: "#/components/schemas/EmailTaskContent"
        idempotency_key: { type: string, maxLength: 128 }
        priority: { type: integer, minimum: -100, maximum: 100, default: 0 }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
        auto_run: { type: boolean, default: false }
    QuotaTaskContent:
      type: object
      required: [delta_mb, reason]
      properties:
        delta_mb: { type: integer, format: int64, minimum: -1000000000, maximum: 1000000000 }
        reason: { type: string, minLength: 3, maxLength: 255 }
    EmailTaskContent:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 100000 }
    AdminTask:
      type: object
      required: [id, type, status, total, current, attempts, max_attempts]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [quota, email, node_detect, node_reconcile, node_lifecycle, protocol_deploy, protocol_active, node_group_reconcile] }
        scope: { type: string, description: Canonical JSON scope snapshot. }
        content: { type: string, description: Canonical JSON content snapshot. }
        status:
          type: integer
          enum: [0, 1, 2, 3]
          description: Pending, running, completed, or failed.
        errors: { type: string }
        total: { type: integer, format: int64 }
        current: { type: integer, format: int64 }
        idempotency_key: { type: string }
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        pending_count: { type: integer, format: int64, minimum: 0 }
        running_count: { type: integer, format: int64, minimum: 0 }
        succeeded_count: { type: integer, format: int64, minimum: 0 }
        failed_count: { type: integer, format: int64, minimum: 0 }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminTaskPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
