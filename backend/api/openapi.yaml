  /api/v1/subscription/protocol-loads:
    get:
      tags: [subscriptions]
      summary: List current protocol activity visible to the signed-in subscriber
      description: Returns aggregate active-user and active-flow counts only for protocol endpoints covered by the caller's currently usable subscriptions. Activity uses a two-minute Zero flow-event window; identities, credentials, host details and traffic records are never exposed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscriber-scoped protocol load snapshot
          content:
