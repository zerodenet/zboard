openapi: 3.0.3
info:
  title: zboard API
  version: v0.0.1
  description: |
    zboard single-binary operations console API for subscriber and operator workflows.
    Root namespace for all APIs: /api/v1
servers:
  - url: http://localhost:8080
  - url: https://api.example.com
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: admin
  - name: nodes
  - name: plans
  - name: orders
  - name: subscriptions
  - name: traffic
paths:
  /healthz:
    get:
      tags:
        - system
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /readyz:
    get:
      tags:
        - system
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/version:
    get:
      tags:
        - system
      summary: Service version
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/VersionInfo"
  /api/v1/system/info:
    get:
      tags:
        - system
      summary: System capabilities
      security: []
      responses:
        "200":
          description: Service capability and deployment info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SystemInfo"
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: User created, token returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Current user profile
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/admin/users:
    get:
      tags:
        - admin
      summary: List users
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: is_admin
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
    post:
      tags:
        - admin
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateRequest"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/admin/users/{id}:
    put:
      tags:
        - admin
      summary: Update user fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/nodes:
    get:
      tags:
        - nodes
      summary: List nodes
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Node"
    post:
      tags:
        - nodes
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreateRequest"
      responses:
        "200":
          description: Created node
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/ssh/test:
    post:
      tags:
        - nodes
      summary: Test node SSH and update status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHTestRequest"
      responses:
        "200":
          description: SSH test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/{id}/ssh:
    put:
      tags:
        - nodes
      summary: Replace node SSH endpoint, encrypted password, and pinned host key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHConfigRequest"
      responses:
        "200":
          description: SSH configuration updated and node marked offline until retested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/report-credential:
    post:
      tags:
        - nodes
      summary: Create or rotate a node traffic-report credential
      description: Admin only. The plaintext secret is returned once and the previous credential is immediately invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential created or rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/NodeReportCredential"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - nodes
      summary: Revoke a node traffic-report credential
      description: Admin only. New traffic reports using this credential are rejected immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential revoked
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/protocol/config:
    post:
      tags:
        - nodes
      summary: Publish protocol config to node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeProtocolConfigRequest"
      responses:
        "200":
          description: Node updated with protocol template
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/plans:
    get:
      tags:
        - plans
      summary: List plans
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
          description: |
            Admin-only flag. When true, inactive plans are returned for management.
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Plan"
    post:
      tags:
        - plans
      summary: Create plan (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateRequest"
      responses:
        "200":
          description: Created plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Plan"
  /api/v1/admin/plans/{id}:
    put:
      tags:
        - plans
      summary: Update plan fields and toggle active state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateRequest"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Plan"
  /api/v1/orders:
    get:
      tags:
        - orders
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
          description: Admin-only query to scope another user.
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
    post:
      tags:
        - orders
      summary: Create order for plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/orders/{id}/pay-callback:
    post:
      tags:
        - orders
      summary: Apply an admin-authenticated payment result
      description: |
        Locks the order before applying the result. Repeating the same result is idempotent and never
        renews a subscription twice. Paid orders cannot transition back to failed or canceled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCallbackRequest"
      responses:
        "200":
          description: Order + subscription state after callback
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/orders/{id}/pay:
    post:
      tags:
        - orders
      summary: Self-service pay action for pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Admin-only reconciliation flag; normal users may only pay pending or previously failed orders.
      responses:
        "200":
          description: Order paid and subscription applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - orders
      summary: Cancel pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Admin-only reconciliation flag. Paid orders remain terminal and cannot be canceled.
      responses:
        "200":
          description: Order canceled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/subscriptions:
    get:
      tags:
        - subscriptions
      summary: List subscriptions
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"
  /api/v1/subscription/access:
    get:
      tags:
        - subscriptions
      summary: Get current subscription URL metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription access metadata
    delete:
      tags:
        - subscriptions
      summary: Revoke the current subscription URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription URL revoked
  /api/v1/subscription/access/rotate:
    post:
      tags:
        - subscriptions
      summary: Generate or rotate the subscription URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token returned once
  /api/v1/client/subscription/{token}:
    get:
      tags:
        - subscriptions
      summary: Fetch the versioned ZeroDenet client subscription manifest
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client subscription manifest and Subscription-Userinfo header
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/traffic/summary:
    get:
      tags:
        - traffic
      summary: Traffic summary
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Traffic summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TrafficSummary"
  /api/v1/traffic/records:
    get:
      tags:
        - traffic
      summary: Traffic records
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
        - name: node_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Traffic record list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TrafficRecord"
  /api/v1/traffic/report:
    post:
      tags:
        - traffic
      summary: Submit a signed node traffic report
      description: |
        This endpoint is authenticated by a node report credential, not by a user bearer token.
        Compute SHA-256 over the exact request body, then sign the following UTF-8 canonical string
        with HMAC-SHA256 using the node secret:

        `node_id + "\n" + unix_timestamp + "\n" + nonce + "\n" + lowercase_hex(body_sha256)`

        Send the lowercase hexadecimal HMAC in `X-Zboard-Signature`. Timestamps must be within five
        minutes of server time. A `(node_id, report_id)` pair is idempotent and a nonce may be used once.
      security: []
      parameters:
        - name: X-Zboard-Node-ID
          in: header
          required: true
          schema:
            type: string
          description: Canonical positive decimal node ID.
        - name: X-Zboard-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Canonical Unix timestamp in seconds.
        - name: X-Zboard-Nonce
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
          description: Per-request URL-safe nonce.
        - name: X-Zboard-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
          description: Hexadecimal HMAC-SHA256 signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficReportRequest"
      responses:
        "200":
          description: Traffic report result; duplicate is true when an earlier report was reused without another deduction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TrafficReportResult"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/admin/dashboard:
    get:
      tags:
        - admin
      summary: Admin dashboard metrics
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/DashboardMetrics"
  /api/v1/admin/audit-logs:
    get:
      tags:
        - admin
      summary: List security and business audit events
      description: Admin only. Results are newest first and never include credential plaintext or passwords.
      parameters:
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
        timestamp:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        is_admin:
          type: boolean
        status:
          type: string
    Node:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        region:
          type: string
        address:
          type: string
        protocol:
          type: string
        is_online:
          type: boolean
        last_seen_at:
          type: string
          nullable: true
        ssh_host:
          type: string
        ssh_port:
          type: integer
        ssh_user:
          type: string
        ssh_host_key_fingerprint:
          type: string
          description: Pinned OpenSSH SHA256 host key fingerprint.
        traffic_secret_prefix:
          type: string
          description: Non-secret prefix used to identify the active report credential.
        traffic_secret_revoked_at:
          type: string
          format: date-time
          nullable: true
    Plan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price_cents:
          type: integer
          format: int64
        traffic_gb:
          type: integer
          format: int64
        duration_day:
          type: integer
        max_device:
          type: integer
        is_active:
          type: boolean
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        subscription_id:
          type: integer
          format: int64
          nullable: true
        plan_id:
          type: integer
          format: int64
        trade_no:
          type: string
        amount_cents:
          type: integer
          format: int64
        status:
          type: string
        currency:
          type: string
        channel:
          type: string
    Subscription:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        plan_id:
          type: integer
          format: int64
        start_at:
          type: string
        end_at:
          type: string
        status:
          type: string
        flow_total:
          type: integer
          format: int64
        flow_used:
          type: integer
          format: int64
    TrafficRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        node_id:
          type: integer
          format: int64
        report_id:
          type: string
        used_bytes:
          type: integer
          format: int64
        record_at:
          type: string
        meta:
          type: string
    VersionInfo:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
    SystemInfo:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        name:
          type: string
        api_version:
          type: string
        docs:
          type: object
          properties:
            kernel:
              type: string
        deployment:
          type: object
          properties:
            docker:
              type: boolean
            kubernetes:
              type: boolean
    DashboardMetrics:
      type: object
      properties:
        users:
          type: integer
          format: int64
        users_active:
          type: integer
          format: int64
        nodes:
          type: integer
          format: int64
        plans:
          type: integer
          format: int64
        orders:
          type: integer
          format: int64
        orders_paid:
          type: integer
          format: int64
        revenue_cents:
          type: integer
          format: int64
        subscriptions:
          type: integer
          format: int64
        subscriptions_active:
          type: integer
          format: int64
        traffic_pool_bytes:
          type: integer
          format: int64
          description: Remaining bytes across active, unexpired subscriptions.
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
    TrafficSummary:
      type: object
      properties:
