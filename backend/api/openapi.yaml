          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/nodes:
    get:
      tags:
        - nodes
      summary: List nodes
      parameters:
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope instead of the legacy array. }
        - { name: node_id, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: lifecycle_status, in: query, schema: { type: string, enum: [active, maintenance, retired] } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: connector_online, in: query, schema: { type: boolean } }
        - { name: kernel_status, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [id, name, region, updated_at, last_seen_at] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/Node" }
                          - $ref: "#/components/schemas/NodePage"
    post:
      tags:
        - nodes
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreateRequest"
      responses:
        "200":
          description: Created node
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/{id}:
    get:
      tags: [nodes]
      summary: Read one node asset detail without encrypted configuration or credentials
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Node asset detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/NodeDetail" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags:
        - nodes
      summary: Update node asset metadata and lifecycle
      description: Admin only. Nodes are independent VPS assets and do not require a protocol endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdateRequest" }
      responses:
        "200":
          description: Updated node asset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [nodes]
      summary: Delete an empty node asset
      description: Protocol endpoints, managed certificates, managed DNS records and running node operations block deletion. Remote Zero is not uninstalled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Node asset deleted }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/load:
    get:
      tags: [nodes, admin]
      summary: Sample current node host load through its verified SSH channel
      description: Admin only. This is an on-demand host snapshot and remains separate from authenticated Zero runtime/session statistics.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Current Linux host load snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/NodeLoadSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/ssh/test:
    post:
      tags:
        - nodes
      summary: Test node SSH and update status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHTestRequest"
      responses:
        "200":
          description: SSH test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/{id}/ssh:
    put:
      tags:
        - nodes
      summary: Update node SSH authentication
      description: Authentication chooses password or private key. The first successful SSH connection automatically records the server host key; later connections reject changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHConfigRequest"
      responses:
        "200":
          description: SSH configuration updated and verification reset until retested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/ssh/host-key/reset:
    post:
      tags:
        - nodes
      summary: Reset the recorded SSH host identity
      description: Admin only. Use after independently confirming that a VPS was reinstalled or its SSH host key legitimately changed. The next successful connection records the new key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Recorded host identity cleared }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/ssh/terminal-ticket:
    post:
      tags:
        - nodes
      summary: Create a one-time browser SSH terminal ticket
      description: Admin only. The ticket is bound to the administrator and node, expires after 30 seconds, and can be consumed once. SSH credentials are never returned to the browser.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Short-lived terminal ticket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        required: [ticket, expires_at]
                        properties:
                          ticket:
                            type: string
                            description: One-time bearer value used only for the WebSocket upgrade.
                          expires_at:
                            type: integer
                            format: int64
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/ssh/terminal:
    get:
      tags:
        - nodes
      summary: Upgrade to an interactive SSH terminal WebSocket
      description: Consumes a one-time terminal ticket and proxies an SSH PTY. Client text frames use JSON messages with type input, resize, or ping. Server terminal output uses binary frames; connection state and errors use JSON text frames. The request Origin must match the HTTP Host.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: ticket
          in: query
          required: true
          description: One-time ticket returned by the terminal-ticket endpoint.
          schema:
            type: string
      responses:
        "101": { description: WebSocket connection established }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel:
    get:
      tags: [nodes, admin]
      summary: Read the detected Zero kernel state and recent operations
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Kernel state and operation history }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel/detect:
    post:
      tags: [nodes, admin]
      summary: Detect the installed Zero binary, systemd service, config and control socket
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Detection completed and persisted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel/reconcile:
    post:
      tags: [nodes, admin]
      summary: Reconcile a node to a selected published Zero release and generated runtime config
      description: Supports Linux x86_64 with systemd. The server resolves the selected version back to an exact official release, chooses the GNU or musl artifact for the detected platform, verifies the archive and binary SHA-256, validates the generated config, activates atomically, checks systemd and the local control socket, and rolls back on failure. Downgrade requires an exact version and explicit allow_downgrade confirmation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: string
                  pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
                allow_downgrade:
                  type: boolean
      responses:
        "200": { description: Reconciliation completed or no change was required }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/kernel/releases/latest:
    get:
      tags: [nodes, admin]
      summary: Resolve the latest stable official Zero Linux x86_64 release
      responses:
        "200": { description: "Immutable release tag, URL, size and artifact SHA-256" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/kernel/releases:
    get:
      tags: [nodes, admin]
      summary: List published Zero releases available for explicit version selection
      responses:
        "200": { description: "Stable and prerelease tags with GNU/musl artifact availability" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/report-credential:
    post:
      tags:
        - nodes
      summary: Create or rotate a node traffic-report credential
      description: Admin only. The plaintext secret is returned once and the previous credential is immediately invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential created or rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/NodeReportCredential"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - nodes
      summary: Revoke a node traffic-report credential
      description: Admin only. New traffic reports using this credential are rejected immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential revoked
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/connector-credential:
    post:
      tags:
        - nodes
      summary: Create or rotate the Zero Webhook Connector credential
      description: Admin only. Returns the plaintext API key once; the previous Connector credential is invalidated immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Connector credential created or rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/NodeConnectorCredential" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags:
        - nodes
      summary: Revoke the Zero Webhook Connector credential
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Connector credential revoked }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/heartbeat:
    post:
      tags:
        - node-connector
      summary: Receive a legacy Zero push-connector heartbeat
      description: Compatibility-only route for older kernels. Current Zero nodes report activity through authenticated generic Webhook events. This response is intentionally not wrapped in ApiResponse.
      security:
        - NodeConnectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeConnectorHeartbeat" }
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeConnectorHeartbeatResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/commands:
    get:
      tags:
        - node-connector
      summary: Poll legacy Zero push-connector commands
      description: Compatibility-only route for older kernels. Current Zero configuration is applied through the node publish lifecycle; this implementation returns an empty array.
      security:
        - NodeConnectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Pending commands
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/plans:
    get:
      tags:
        - plans
      summary: List plans
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
          description: |
            Admin-only flag. When true, inactive plans are returned for management.
        - { name: paged, in: query, schema: { type: boolean }, description: Return a bounded page object. Public pages contain active plan summaries and one primary new-purchase SKU; administrators receive management summaries. }
        - { name: q, in: query, schema: { type: string, maxLength: 128 }, description: "Search across name, slug and summary when paged=true." }
        - { name: active, in: query, schema: { type: boolean }, description: Admin-only exact publication-state filter. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/Plan" }
                          - $ref: "#/components/schemas/PlanPage"
                          - $ref: "#/components/schemas/PlanCatalogPage"
    post:
      tags:
        - plans
      summary: Create plan (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateRequest"
      responses:
        "200":
          description: Created plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                       data:
                         $ref: "#/components/schemas/Plan"
  /api/v1/plans/{id}:
    get:
      tags: [plans]
      summary: Get one active public plan catalog item
      description: Returns bounded plan summary data and at most one primary active new-purchase SKU. It never embeds the full SKU collection.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Active plan catalog item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/PlanCatalogItem" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/plans/{id}/skus:
    get:
      tags: [plans]
      summary: List active purchasable SKUs for one active plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string, maxLength: 128 }, description: "Search name, code or currency." }
        - { name: sku_type, in: query, schema: { type: string, enum: [new, renewal, upgrade, traffic_pack] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Bounded active SKU page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/PlanSKUPage" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/plans/{id}:
    get:
      tags:
        - plans
      summary: Get one plan policy and SKU counts
      description: The detail response intentionally omits the unbounded SKU collection. Use the paginated plan SKU route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PlanDetail"
        "404":
          description: Plan not found
    put:
      tags:
        - plans
      summary: Update plan fields and toggle active state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateRequest"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                       data:
                         $ref: "#/components/schemas/Plan"
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
  /api/v1/orders:
    get:
      tags:
        - orders
