                      data:
                        $ref: "#/components/schemas/Plan"
  /api/v1/orders:
    get:
      tags:
        - orders
      summary: List orders owned by the current user
      description: This self-service route remains user-scoped even when the current user also has administrator permission.
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
    post:
      tags:
        - orders
      summary: Create order for plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders:
    get:
      tags: [orders, admin]
      summary: List orders across all users
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Global order list }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{id}/pay-callback:
    post:
      tags:
        - orders
      summary: Apply an admin-authenticated payment result
      description: |
        Locks the order before applying the result. Repeating the same result is idempotent and never
        renews a subscription twice. Paid orders cannot transition back to failed or canceled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCallbackRequest"
      responses:
        "200":
          description: Order + subscription state after callback
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders/{id}/pay:
    post:
      tags:
        - orders
      summary: Confirm a pending order as paid
      description: Admin-only manual settlement endpoint. Normal users cannot mark their own orders as paid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Admin-only reconciliation flag allowing recovery of a canceled order; this endpoint is never available to normal users.
      responses:
        "200":
          description: Order paid and subscription applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - orders
      summary: Cancel pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Order canceled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Order"
  /api/v1/admin/orders/{id}/cancel:
    post:
      tags: [orders, admin]
      summary: Cancel an order as an administrator
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: force, in: query, schema: { type: boolean }, description: Reconciliation flag. Paid orders remain terminal and cannot be canceled. }
      responses:
        "200": { description: Order canceled }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/subscriptions:
    get:
      tags:
        - subscriptions
      summary: List subscriptions owned by the current user
      description: This self-service route remains user-scoped even when the current user also has administrator permission.
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"
  /api/v1/admin/subscriptions:
    get:
      tags: [subscriptions, admin]
      summary: List subscriptions across all users
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Global subscription list }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/subscription/access:
    get:
      tags:
        - subscriptions
      summary: Get current subscription URL metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription access metadata
    delete:
      tags:
        - subscriptions
      summary: Revoke the current subscription URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription URL revoked
  /api/v1/subscription/access/rotate:
    post:
      tags:
        - subscriptions
      summary: Generate or rotate the subscription URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token returned once
  /api/v1/client/subscription/{token}:
    get:
      tags:
        - subscriptions
      summary: Fetch the versioned ZeroDenet client subscription manifest
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client subscription manifest and Subscription-Userinfo header
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/protocol-endpoints:
    get:
      tags: [nodes]
      summary: List protocol endpoints for administration
      responses:
        "200":
          description: Protocol endpoint list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ProtocolEndpoint" }
    post:
      tags: [nodes]
      summary: Create a protocol endpoint without deploying it
      description: Persists the encrypted server configuration. Deployment is an explicit separate action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolEndpointWriteRequest"
      responses:
        "200": { description: Protocol endpoint configuration saved }
  /api/v1/admin/protocol-endpoints/{id}:
    get:
      tags: [nodes]
      summary: Read an admin protocol endpoint including decrypted server configuration
      description: Admin only. The server configuration is returned only to support safe editing and is never exposed by public endpoint lists.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Protocol endpoint detail and latest deployment }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [nodes]
      summary: Update a protocol endpoint without deploying it
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolEndpointWriteRequest" }
      responses:
        "200": { description: Protocol endpoint configuration updated }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-endpoints/{id}/deploy:
    post:
      tags: [nodes]
      summary: Deploy a saved protocol endpoint to its VPS over SSH
      description: Requires valid node SSH authentication. The first successful connection automatically records the host key before the deployment command runs; later changes are rejected.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Protocol endpoint deployed and deployment history recorded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-deployments:
    get:
      tags: [nodes]
      summary: List protocol configuration staging attempts
      parameters:
        - { in: query, name: node_id, schema: { type: integer, format: int64 } }
        - { in: query, name: protocol_endpoint_id, schema: { type: integer, format: int64 } }
        - { in: query, name: status, schema: { type: string, enum: [running, succeeded, failed] } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Paginated protocol deployment history }
  /api/v1/admin/plans/{id}/skus:
    post:
      tags: [plans]
      summary: Add a purchasable SKU to a plan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanSKU" }
      responses:
        "200": { description: SKU created }
  /api/v1/admin/node-groups:
    get:
      tags: [plans]
      summary: List reusable node groups
      responses:
        "200":
          description: Node groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/NodeGroup" }
    post:
      tags: [plans]
      summary: Create a node group and its endpoint membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeGroupCreateRequest" }
      responses:
        "200": { description: Node group created }
  /api/v1/admin/node-groups/{id}:
    put:
      tags: [plans]
      summary: Update a node group and optionally replace its protocol endpoint membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeGroupUpdateRequest" }
      responses:
        "200": { description: Node group updated }
  /api/v1/admin/plan-skus/{id}:
    put:
      tags: [plans]
      summary: Update pricing and service specification for a SKU
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanSKU" }
      responses:
        "200": { description: SKU updated }
  /api/v1/traffic/summary:
    get:
      tags:
        - traffic
      summary: Traffic summary for the current user
      description: This self-service route remains user-scoped even when the current user also has administrator permission.
      responses:
        "200":
          description: Traffic summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TrafficSummary"
  /api/v1/admin/traffic/summary:
    get:
      tags: [traffic, admin]
      summary: Traffic summary across all users or one selected user
      parameters:
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Administrative traffic summary }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/traffic/records:
    get:
      tags:
        - traffic
      summary: Traffic records for the current user
      description: All filters remain constrained to records owned by the current user.
      parameters:
        - name: node_id
          in: query
          schema:
            type: integer
            format: int64
        - name: subscription_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Traffic record list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TrafficRecord"
  /api/v1/admin/traffic/records:
    get:
      tags: [traffic, admin]
      summary: Traffic records across all users
      parameters:
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: node_id, in: query, schema: { type: integer, format: int64 } }
        - { name: protocol_endpoint_id, in: query, schema: { type: integer, format: int64 } }
        - { name: subscription_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Global traffic record list }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/traffic/reconciliation:
    get:
      tags:
        - traffic
      summary: Reconcile subscription counters against attributed traffic records
      description: Reconciles only subscriptions owned by the current user, including when that user also has administrator permission.
      parameters:
        - name: subscription_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Subscription reconciliation rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TrafficReconciliationItem"
  /api/v1/admin/traffic/reconciliation:
    get:
      tags: [traffic, admin]
      summary: Reconcile subscriptions across all users
      parameters:
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: subscription_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Global reconciliation rows }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/traffic/report:
    post:
      tags:
        - traffic
      summary: Submit a signed node traffic report
      description: |
        This endpoint is authenticated by a node report credential, not by a user bearer token.
        Compute SHA-256 over the exact request body, then sign the following UTF-8 canonical string
        with HMAC-SHA256 using the node secret:

        `node_id + "\n" + unix_timestamp + "\n" + nonce + "\n" + lowercase_hex(body_sha256)`

        Send the lowercase hexadecimal HMAC in `X-Zboard-Signature`. Timestamps must be within five
        minutes of server time. A `(node_id, report_id)` pair is idempotent and a nonce may be used once.
      security: []
      parameters:
        - name: X-Zboard-Node-ID
          in: header
          required: true
          schema:
            type: string
          description: Canonical positive decimal node ID.
        - name: X-Zboard-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Canonical Unix timestamp in seconds.
        - name: X-Zboard-Nonce
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
          description: Per-request URL-safe nonce.
        - name: X-Zboard-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
          description: Hexadecimal HMAC-SHA256 signature.
        - name: X-Zboard-Node-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
          description: Optional node runtime version persisted with the synchronization heartbeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficReportRequest"
      responses:
        "200":
          description: Traffic report result; duplicate is true when an earlier report was reused without another deduction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TrafficReportResult"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/admin/dashboard:
    get:
      tags:
        - admin
      summary: Admin dashboard metrics
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/DashboardMetrics"
  /api/v1/admin/audit-logs:
    get:
      tags:
        - admin
      summary: List security and business audit events
      description: Admin only. Results are newest first and never include credential plaintext or passwords.
      parameters:
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    NodeConnectorBearer:
      type: http
      scheme: bearer
      bearerFormat: ZeroNodeAPIKey
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
        timestamp:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        is_admin:
          type: boolean
        status:
          type: string
    TicketStatus:
      type: string
      enum: [open, pending_admin, pending_user, resolved, closed]
    TicketCategory:
      type: string
      enum: [connection, billing, account, other]
    TicketCreateRequest:
      type: object
      required: [subject, category, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 160 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { type: integer, enum: [1, 2], default: 1 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    TicketReplyRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    TicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
    Ticket:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ticket_no: { type: string }
        user_id: { type: integer, format: int64 }
        user_email: { type: string, format: email }
        subject: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { type: integer, enum: [1, 2] }
        status: { $ref: "#/components/schemas/TicketStatus" }
        message_count: { type: integer, format: int64 }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ticket_id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64, nullable: true }
        author_role: { type: string, enum: [user, admin, system] }
        author_email: { type: string }
        type: { type: string, enum: [message, status] }
        body: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        created_at: { type: string, format: date-time }
    SystemConfig:
      type: object
      required: [id, config_key, name, value_type, is_public, is_secret, configured, revision]
      properties:
        id: { type: integer, format: int64 }
        config_key: { type: string }
        name: { type: string }
        value:
          description: Omitted for secret configuration.
          oneOf:
            - { type: string }
            - { type: boolean }
            - { type: integer, format: int64 }
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
        value_type: { type: string, enum: [string, bool, int, json] }
        description: { type: string }
        is_public: { type: boolean }
