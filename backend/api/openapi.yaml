              items: { $ref: "#/components/schemas/ProtocolEndpointSummary" }
    SubscriptionTemplate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        slug: { type: string, maxLength: 80, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, maxLength: 255 }
        renderer: { type: string, enum: [znet-sink, clash, sing-box, unsupported], description: Backend-owned base encoder. Unsupported is emitted only for disabled legacy records awaiting conversion. }
        customization:
          $ref: "#/components/schemas/SubscriptionTemplateCustomization"
        content_type: { type: string, enum: [text/plain, text/yaml, application/yaml, application/json], description: Read-only response type derived from the renderer. Omitted for unsupported legacy records. }
        is_active: { type: boolean }
        sort_order: { type: integer }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SubscriptionRuleSet:
      type: object
      required: [id, name, renderer, tag, url, format, interval, is_active, revision, usage_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 255 }
        renderer: { type: string, enum: [znet-sink, clash, sing-box] }
        tag: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        url: { type: string, format: uri, maxLength: 2048 }
        behavior: { type: string, enum: [domain, ipcidr, classical], description: Clash-only provider behavior. }
        format: { type: string, enum: [domain_list, cidr_list, zero_rule_ir, zrs, yaml, text, mrs, source, binary] }
        interval: { type: integer, minimum: 60, maximum: 604800 }
        is_active: { type: boolean }
        revision: { type: integer, format: int64, minimum: 1 }
        usage_count: { type: integer, format: int64, minimum: 0, description: Number of templates referencing this rule set. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SubscriptionRuleSetPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SubscriptionRuleSet" }
    SubscriptionRuleSetWriteRequest:
      type: object
      additionalProperties: false
      required: [name, renderer, tag, url, interval, is_active]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 255 }
        renderer: { type: string, enum: [znet-sink, clash, sing-box] }
        tag: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        url: { type: string, format: uri, maxLength: 2048 }
        behavior: { type: string, enum: [domain, ipcidr, classical] }
        format: { type: string, enum: [domain_list, cidr_list, zero_rule_ir, zrs, yaml, text, mrs, source, binary] }
        interval: { type: integer, minimum: 60, maximum: 604800 }
        is_active: { type: boolean }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    SubscriptionTemplatePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SubscriptionTemplate" }
    SubscriptionTemplateWriteRequest:
      type: object
      required: [name, slug, renderer, is_active]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, maxLength: 80, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, maxLength: 255 }
        renderer: { type: string, enum: [znet-sink, clash, sing-box] }
        customization:
          $ref: "#/components/schemas/SubscriptionTemplateCustomization"
        is_active: { type: boolean }
        sort_order: { type: integer }
        expected_revision: { type: integer, format: int64, minimum: 1, description: Optional optimistic concurrency guard for updates. }
    SubscriptionTemplatePreviewRequest:
      type: object
      required: [renderer]
      properties:
        renderer: { type: string, enum: [znet-sink, clash, sing-box] }
        customization:
          $ref: "#/components/schemas/SubscriptionTemplateCustomization"
    SubscriptionTemplateCustomization:
      type: object
      additionalProperties: false
      description: Declarative, non-executable policy groups and rule bindings applied to a backend-owned renderer. Dynamic nodes and credentials remain backend-managed.
      required: [version, main_group, policy_groups, final, rule_sets]
      properties:
        version: { type: integer, enum: [2] }
        mixed_port: { type: integer, minimum: 1, maximum: 65535, default: 7890, description: Local loopback mixed HTTP and SOCKS inbound port emitted for every supported client renderer. Omission is accepted for older version-2 records and normalizes to 7890. }
        main_group: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: ID of the policy group used as the primary client selector. }
        policy_groups:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/SubscriptionPolicyGroup"
        final: { type: string, pattern: "^(direct|group:[a-z][a-z0-9-]{0,31})$", description: Final routing target. }
        rule_sets:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/SubscriptionTemplateRuleSet"
        advanced_source:
          type: string
          maxLength: 131072
          description: YAML for Clash or JSON for ZNet Sink and sing-box. Deep-merged after visual configuration and validated as a final client document. Root proxies/outbounds replacement must retain the documented Zboard generated injection marker; $zboard:all-nodes expands node names in member arrays.
    SubscriptionPolicyGroup:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        name: { type: string, minLength: 1, maxLength: 64, description: Native client policy-group name or tag. }
        type: { type: string, enum: [select, urltest, fallback], description: fallback is supported only by Clash and ZNet Sink. }
        include_pattern: { type: string, maxLength: 256, description: Optional RE2 regular expression matched against protocol configuration names. Empty includes every available node. }
        exclude_pattern: { type: string, maxLength: 256, description: Optional RE2 regular expression applied after include_pattern. }
        include_groups:
          type: array
          maxItems: 15
          uniqueItems: true
          items: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        default_group: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: Optional included group selected first by a select group. }
        probe_url: { type: string, format: uri, maxLength: 2048 }
        interval: { type: integer, minimum: 60, maximum: 86400 }
        tolerance: { type: integer, minimum: 0, maximum: 10000 }
    SubscriptionTemplateRuleSet:
      type: object
      additionalProperties: false
      required: [target]
      description: Either a reusable rule-set reference with rule_set_id, or a template-only remote shortcut with source fields.
      oneOf:
        - required: [rule_set_id, target]
        - required: [tag, url, format, target, interval]
      properties:
        rule_set_id: { type: integer, format: int64, minimum: 1, description: Reusable rule-set ID. Source fields cannot override a referenced record. }
        tag: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        url: { type: string, format: uri, maxLength: 2048 }
        behavior: { type: string, enum: [domain, ipcidr, classical], description: Clash-only provider behavior. }
        format: { type: string, enum: [domain_list, cidr_list, zero_rule_ir, zrs, yaml, text, mrs, source, binary] }
        target: { type: string, pattern: "^(direct|reject|group:[a-z][a-z0-9-]{0,31})$", description: "Policy-group ID, direct or reject target used when this rule set matches." }
        interval: { type: integer, minimum: 60, maximum: 604800 }
    SubscriptionTemplatePreview:
      type: object
      required: [content, content_type, bytes, line_count, truncated]
      properties:
        content: { type: string, maxLength: 262144, description: UTF-8-safe display preview capped at 256 KiB. }
        content_type: { type: string, enum: [text/plain, text/yaml, application/yaml, application/json] }
        bytes: { type: integer, minimum: 0, description: Full rendered byte size before display truncation. }
        line_count: { type: integer, minimum: 1, description: Full rendered line count before display truncation. }
        truncated: { type: boolean }
