        "403": { $ref: "#/components/responses/Error" }
  /api/zero/events:
    post:
      tags: [traffic]
      summary: Receive authenticated Zero Connector events
      description: |
        Accepts `zero.event.v1` envelopes emitted by Zero's webhook event sink. The node is identified by
        `source_id` (`node-{id}`) and authenticated with its Connector bearer credential. Lifecycle events
        refresh the node's Connector activity; `flow.updated` events apply only the new cumulative byte
        delta and `flow.completed` settles the final delta.
        Attribution is resolved from the credential principal on the server; request-supplied user IDs are ignored.
      security:
        - NodeConnectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZeroEventEnvelope"
      responses:
        "200": { description: "Event accepted, deduplicated and charged when attributable" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/traffic/report:
    post:
      tags:
        - traffic
      summary: Submit a signed node traffic report
      description: |
        This endpoint is authenticated by a node report credential, not by a user bearer token.
        Compute SHA-256 over the exact request body, then sign the following UTF-8 canonical string
        with HMAC-SHA256 using the node secret:

        `node_id + "\n" + unix_timestamp + "\n" + nonce + "\n" + lowercase_hex(body_sha256)`

        Send the lowercase hexadecimal HMAC in `X-Zboard-Signature`. Timestamps must be within five
        minutes of server time. A `(node_id, report_id)` pair is idempotent and a nonce may be used once.
      security: []
      parameters:
        - name: X-Zboard-Node-ID
          in: header
          required: true
          schema:
            type: string
          description: Canonical positive decimal node ID.
        - name: X-Zboard-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Canonical Unix timestamp in seconds.
        - name: X-Zboard-Nonce
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
          description: Per-request URL-safe nonce.
        - name: X-Zboard-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
          description: Hexadecimal HMAC-SHA256 signature.
        - name: X-Zboard-Node-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
          description: Optional node runtime version persisted with the synchronization heartbeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficReportRequest"
      responses:
        "200":
          description: Traffic report result; duplicate is true when an earlier report was reused without another deduction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TrafficReportResult"
        "401":
          $ref: "#/components/responses/Error"
