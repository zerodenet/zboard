  /api/v1/admin/protocol-endpoints/order:
    get:
      tags: [nodes, subscriptions, admin]
      operationId: getProtocolEndpointDeliveryOrder
      summary: Load the complete global protocol delivery order
      description: Returns every protocol endpoint in persisted business-delivery order. The snapshot is intentionally independent of list filters, pagination and display grouping, and includes an optimistic version for a later complete-scope update.
      responses:
        "200":
          description: Complete protocol endpoint delivery-order snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/ProtocolEndpointOrderSnapshot" }
    put:
      tags: [nodes, subscriptions, admin]
      operationId: updateProtocolEndpointDeliveryOrder
      summary: Replace the complete global protocol delivery order
      description: Requires every current protocol endpoint exactly once and the version returned by GET. The change affects subsequent subscription rendering only; it does not publish or restart Zero. Node-group relationship order remains the higher-priority order for that group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolEndpointOrderRequest" }
      responses:
        "200":
          description: Updated complete delivery order; no node publication was required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/ProtocolEndpointOrderMutationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-endpoints/selection:
    get:
      tags: [nodes, plans]
      operationId: resolveProtocolEndpointSelection
      summary: Resolve a bounded ID-only snapshot of the current protocol endpoint filter
      description: Used by large node-group membership editors to add or remove every endpoint matching one server-side filter without paging through endpoint details. The response is capped at 10000 IDs and represents the result at resolved_at.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: node_id, in: query, schema: { type: integer, format: int64 } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: deployment_status, in: query, schema: { type: string, enum: [running, succeeded, failed, never] } }
      responses:
        "200":
          description: Stable ID-only selection snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/ProtocolEndpointSelectionSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-endpoints:
    get:
      tags: [nodes]
      summary: List protocol endpoints for administration
      parameters:
        - { name: paged, in: query, schema: { type: boolean } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string }, description: "Comma-separated endpoint IDs, at most 100, used to hydrate remote multi-select state." }
        - { name: node_id, in: query, schema: { type: integer, format: int64 } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: deployment_status, in: query, schema: { type: string, enum: [running, succeeded, failed, never] } }
        - { name: sort, in: query, schema: { type: string, enum: [sort_order, id, name, node_id, protocol, multiplier, updated_at] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: Protocol endpoint list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/ProtocolEndpoint" }
                          - $ref: "#/components/schemas/ProtocolEndpointPage"
    post:
      tags: [nodes]
      summary: Create a protocol endpoint and apply its classified operational effect
      description: Persists the endpoint, compares normalized plaintext configuration before encryption, applies revision-guarded incremental node-group membership commands in the same transaction, and queues node publication only for active runtime or credential-set changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolEndpointWriteRequest"
      responses:
        "200":
          description: Protocol endpoint saved with classified change effects and current node-group memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ProtocolEndpointMutationResult"
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-endpoints/reality-keypair:
    post:
      tags: [nodes, admin]
      summary: Generate an X25519 Reality key pair and short ID
      description: Admin only. The private key is returned only to the editor and must be stored in the encrypted endpoint server configuration; subscription output receives only the public key.
      responses:
        "200":
          description: Newly generated Reality material
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/RealityKeyPair" }
  /api/v1/admin/protocol-endpoints/reality-template:
    post:
      tags: [nodes, admin]
      summary: Generate a complete recommended VLESS Reality scenario template
      description: Admin only. Selects a maintained SNI/fingerprint preset and generates a fresh matching X25519 key pair and short ID in one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset: { type: string, enum: [compatible, cdn, apple], default: compatible }
      responses:
        "200":
          description: Generated Reality scenario values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/RealityTemplate" }
  /api/v1/admin/protocol-endpoints/{id}:
    get:
      tags: [nodes]
      summary: Read an admin protocol endpoint including decrypted server configuration
      description: Admin only. The server configuration is returned only to support safe editing and is never exposed by public endpoint lists.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Protocol endpoint detail, latest deployment and revision-bearing node-group memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/ProtocolEndpointAdminDetail" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [nodes]
      summary: Update a protocol endpoint and apply its classified operational effect
      description: Delivery, billing and management changes avoid node publication. Runtime changes publish the current node; carrier-node changes migrate credentials and publish only the previous and target nodes. Node-group membership is changed incrementally with each group revision as an optimistic precondition.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolEndpointWriteRequest" }
      responses:
        "200":
          description: Protocol endpoint updated with classified change effects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ProtocolEndpointMutationResult"
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [nodes, admin]
      summary: Remove and delete a protocol endpoint
      description: Active endpoints are first removed through a verified full node configuration publish. Active plan references and running deployments block deletion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
