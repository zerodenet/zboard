openapi: 3.0.3
info:
  title: zboard API
  version: v0.0.1
  description: |
    zboard single-binary operations console API for subscriber and operator workflows.
    Root namespace for all APIs: /api/v1
servers:
  - url: http://localhost:8080
  - url: https://api.example.com
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: admin
  - name: nodes
  - name: plans
  - name: orders
  - name: subscriptions
  - name: traffic
  - name: tickets
paths:
  /healthz:
    get:
      tags:
        - system
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /readyz:
    get:
      tags:
        - system
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/version:
    get:
      tags:
        - system
      summary: Service version
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/VersionInfo"
  /api/v1/setup/status:
    get:
      tags: [system]
      summary: Read one-time installation status and public site settings
      security: []
      responses:
        "200":
          description: Installation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup/install:
    post:
      tags: [system]
      summary: Complete the one-time installation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallRequest"
      responses:
        "200":
          description: Installation completed and administrator token returned
        "409":
          description: Installation has already completed
  /api/v1/system/info:
    get:
      tags:
        - system
      summary: System capabilities
      security: []
      responses:
        "200":
          description: Service capability and deployment info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SystemInfo"
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: User created, token returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/admin/settings:
    put:
      tags: [admin]
      summary: Update public site settings after installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_name, site_url, allow_registration]
              properties:
                site_name:
                  type: string
                  maxLength: 80
                site_url:
                  type: string
                  format: uri
                allow_registration:
                  type: boolean
      responses:
        "200":
          description: Site settings updated
  /api/v1/system/configs:
    get:
      tags: [system]
      operationId: listPublicSystemConfigs
      summary: List public non-secret runtime configuration
      responses:
        "200":
          description: Public system configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SystemConfig" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system-configs:
    get:
      tags: [admin]
      operationId: listAdminSystemConfigs
      summary: List typed runtime configuration with secret values redacted
      responses:
        "200":
          description: System configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SystemConfig" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system-configs/{key}:
    put:
      tags: [admin]
      operationId: updateAdminSystemConfig
      summary: Update one typed system configuration value
      description: Existing keys only. Secret values are encrypted before storage and never returned. expected_revision enables optimistic concurrency control.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9_]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConfigUpdateRequest" }
      responses:
        "200":
          description: Updated system configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/SystemConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks:
    get:
      tags: [admin]
      operationId: listAdminTasks
      summary: List quota and email tasks
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [quota, email] }
        - name: status
          in: query
          schema: { type: integer, minimum: 0, maximum: 3 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createAdminTask
      summary: Create an auditable quota adjustment or email task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTaskCreateRequest" }
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks/{id}:
    get:
      tags: [admin]
      operationId: getAdminTask
      summary: Read one task and all of its item results
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTaskDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks/{id}/run:
    post:
      tags: [admin]
      operationId: runAdminTask
      summary: Start or retry a task asynchronously
      description: Completed items are skipped. Quota items are idempotent through quota-event references; email delivery is at-least-once when a process fails after SMTP accepts a message.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202": { description: Task execution started }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Current user profile
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/tickets:
    get:
      tags: [tickets]
      summary: List tickets owned by the current user
      description: This self-service route always keeps user scope, including when the signed-in user also has administrator permission.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/TicketCategory" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: Ticket list }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [tickets]
      summary: Create a ticket and its first timeline message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreateRequest" }
      responses:
        "200": { description: Ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}:
    get:
      tags: [tickets]
      summary: Read a ticket and its complete timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Ticket detail }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}/messages:
    post:
      tags: [tickets]
      summary: Reply to a ticket
      description: A self-service reply moves the ticket to pending_admin. Closed tickets reject replies.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}/close:
    post:
      tags: [tickets]
      summary: Close a ticket owned by the current user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Closed ticket detail }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets:
    get:
      tags: [tickets, admin]
      summary: List the global support queue
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/TicketCategory" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: Global ticket list }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets/{id}:
    get:
      tags: [tickets, admin]
      summary: Read any ticket and its complete timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Ticket detail }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets/{id}/messages:
    post:
      tags: [tickets, admin]
      summary: Reply to a ticket as an administrator
      description: An administrator reply moves the ticket to pending_user. Closed tickets reject replies.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets/{id}/status:
    put:
      tags: [tickets, admin]
      summary: Change ticket status as an administrator
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      tags:
        - admin
      summary: List users
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: is_admin
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
    post:
      tags:
        - admin
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateRequest"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/admin/users/{id}:
    put:
      tags:
        - admin
      summary: Update user fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/nodes:
    get:
      tags:
        - nodes
      summary: List nodes
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Node"
    post:
      tags:
        - nodes
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreateRequest"
      responses:
        "200":
          description: Created node
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/{id}:
    put:
      tags:
        - nodes
      summary: Update node asset metadata and lifecycle
      description: Admin only. Nodes are independent VPS assets and do not require a protocol endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdateRequest" }
      responses:
        "200":
          description: Updated node asset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/ssh/test:
    post:
      tags:
        - nodes
      summary: Test node SSH and update status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHTestRequest"
      responses:
        "200":
          description: SSH test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
  /api/v1/nodes/{id}/ssh:
    put:
      tags:
        - nodes
      summary: Update node SSH authentication
      description: Authentication chooses password or private key. The first successful SSH connection automatically records the server host key; later connections reject changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSSHConfigRequest"
      responses:
        "200":
          description: SSH configuration updated and verification reset until retested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/ssh/host-key/reset:
    post:
      tags:
        - nodes
      summary: Reset the recorded SSH host identity
      description: Admin only. Use after independently confirming that a VPS was reinstalled or its SSH host key legitimately changed. The next successful connection records the new key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Recorded host identity cleared }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/ssh/terminal-ticket:
    post:
      tags:
        - nodes
      summary: Create a one-time browser SSH terminal ticket
      description: Admin only. The ticket is bound to the administrator and node, expires after 30 seconds, and can be consumed once. SSH credentials are never returned to the browser.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Short-lived terminal ticket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        required: [ticket, expires_at]
                        properties:
                          ticket:
                            type: string
                            description: One-time bearer value used only for the WebSocket upgrade.
                          expires_at:
                            type: integer
                            format: int64
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/ssh/terminal:
    get:
      tags:
        - nodes
      summary: Upgrade to an interactive SSH terminal WebSocket
      description: Consumes a one-time terminal ticket and proxies an SSH PTY. Client text frames use JSON messages with type input, resize, or ping. Server terminal output uses binary frames; connection state and errors use JSON text frames. The request Origin must match the HTTP Host.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: ticket
          in: query
          required: true
          description: One-time ticket returned by the terminal-ticket endpoint.
          schema:
            type: string
      responses:
        "101": { description: WebSocket connection established }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel:
    get:
      tags: [nodes, admin]
      summary: Read the detected Zero kernel state and recent operations
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Kernel state and operation history }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel/detect:
    post:
      tags: [nodes, admin]
      summary: Detect the installed Zero binary, systemd service, config and control socket
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Detection completed and persisted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/kernel/reconcile:
    post:
      tags: [nodes, admin]
      summary: Reconcile a node to the latest stable Zero release and generated runtime config
      description: Supports Linux x86_64 with systemd. The server resolves an exact official release, verifies the archive and binary SHA-256, validates the generated config, activates atomically, checks systemd and the local control socket, and rolls back on failure. Automatic downgrade is refused.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Reconciliation completed or no change was required }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/kernel/releases/latest:
    get:
      tags: [nodes, admin]
      summary: Resolve the latest stable official Zero Linux x86_64 release
      responses:
        "200": { description: Immutable release tag, URL, size and artifact SHA-256 }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/report-credential:
    post:
      tags:
        - nodes
      summary: Create or rotate a node traffic-report credential
      description: Admin only. The plaintext secret is returned once and the previous credential is immediately invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential created or rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/NodeReportCredential"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - nodes
      summary: Revoke a node traffic-report credential
      description: Admin only. New traffic reports using this credential are rejected immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Credential revoked
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/connector-credential:
    post:
      tags:
        - nodes
      summary: Create or rotate the Zero push connector credential
      description: Admin only. Returns the plaintext API key once; the previous connector credential is invalidated immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Connector credential created or rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/NodeConnectorCredential" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags:
        - nodes
      summary: Revoke the Zero push connector credential
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Connector credential revoked }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/heartbeat:
    post:
      tags:
        - node-connector
      summary: Receive a Zero push connector heartbeat
      description: Uses the native Zero connector contract and Bearer API-key authentication. This response is intentionally not wrapped in ApiResponse.
      security:
        - NodeConnectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeConnectorHeartbeat" }
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeConnectorHeartbeatResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/nodes/{id}/commands:
    get:
      tags:
        - node-connector
      summary: Poll pending Zero connector commands
      description: Returns the native raw command array. Command delivery is reserved; the current implementation returns an empty array.
      security:
        - NodeConnectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Pending commands
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/plans:
    get:
      tags:
        - plans
      summary: List plans
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
          description: |
            Admin-only flag. When true, inactive plans are returned for management.
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Plan"
    post:
      tags:
        - plans
      summary: Create plan (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateRequest"
      responses:
        "200":
          description: Created plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Plan"
  /api/v1/admin/plans/{id}:
    put:
      tags:
        - plans
      summary: Update plan fields and toggle active state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateRequest"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
