openapi: 3.0.3
info:
  title: zboard API
  version: v0.0.1
  description: |
    zboard single-binary operations console API for subscriber and operator workflows.
    Business APIs use /api/v1. Zero's standard event webhook is exposed at /api/zero/events.
servers:
  - url: http://localhost:8080
  - url: https://api.example.com
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: admin
  - name: nodes
  - name: plans
  - name: orders
  - name: subscriptions
  - name: traffic
  - name: tickets
paths:
  /healthz:
    get:
      tags:
        - system
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /readyz:
    get:
      tags:
        - system
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/version:
    get:
      tags:
        - system
      summary: Service version
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/VersionInfo"
  /api/v1/setup/status:
    get:
      tags: [system]
      summary: Read one-time installation status and public site settings
      security: []
      responses:
        "200":
          description: Installation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup/install:
    post:
      tags: [system]
      summary: Complete the one-time installation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallRequest"
      responses:
        "200":
          description: Installation completed and administrator token returned
        "409":
          description: Installation has already completed
  /api/v1/system/info:
    get:
      tags:
        - system
      summary: System capabilities
      security: []
      responses:
        "200":
          description: Service capability and deployment info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SystemInfo"
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: User created, token returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/admin/settings:
    put:
      tags: [admin]
      summary: Update public site settings after installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_name, site_url, allow_registration]
              properties:
                site_name:
                  type: string
                  maxLength: 80
                site_url:
                  type: string
                  format: uri
                allow_registration:
                  type: boolean
      responses:
        "200":
          description: Site settings updated
  /api/v1/admin/provider-definitions:
    get:
      tags: [admin, providers]
      summary: List built-in external supplier adapters and capabilities
      responses:
        "200":
          description: Provider catalog
  /api/v1/admin/provider-accounts:
    get:
      tags: [admin, providers]
      summary: List configured external supplier accounts with redacted credentials
      responses:
        "200":
          description: Provider accounts
    post:
      tags: [admin, providers]
      summary: Save and verify a Cloudflare provider account
      responses:
        "201":
          description: Provider account created
  /api/v1/admin/provider-accounts/{id}/verify:
    post:
      tags: [admin, providers]
      summary: Reverify an external supplier account
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Provider account verified
  /api/v1/admin/dns-records:
    get:
      tags: [admin, providers]
      summary: List panel-managed DNS records
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, syncing, active, drifted, failed] } }
      responses:
        "200":
          description: Managed DNS record page
    post:
      tags: [admin, providers]
      summary: Create and asynchronously synchronize one A record, one AAAA record, or both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_account_id, node_id, domain_name, records]
              properties:
                provider_account_id: { type: integer, format: int64 }
                node_id: { type: integer, format: int64 }
                domain_name: { type: string, maxLength: 253 }
                records:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [record_type, record_value]
                    properties:
                      record_type: { type: string, enum: [A, AAAA] }
                      record_value: { type: string }
                ttl: { type: integer, minimum: 1 }
                proxied: { type: boolean }
                takeover_existing: { type: boolean }
      responses:
        "202":
          description: DNS synchronization started
  /api/v1/admin/dns-records/{id}:
    put:
      tags: [admin, providers]
      summary: Update a managed DNS record and synchronize it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_account_id, node_id, domain_name, record_type, record_value, ttl, proxied, expected_revision]
              properties:
                provider_account_id: { type: integer, format: int64, description: Immutable identity field. }
                node_id: { type: integer, format: int64 }
                domain_name: { type: string, description: Immutable identity field. }
                record_type: { type: string, enum: [A, AAAA], description: Immutable identity field. }
                record_value: { type: string }
                ttl: { type: integer, minimum: 1 }
                proxied: { type: boolean }
                expected_revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "202": { description: DNS update synchronization started }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin, providers]
      summary: Delete the exact owned Cloudflare record, then remove its panel record
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Remote and panel records deleted }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/dns-records/{id}/sync:
    post:
      tags: [admin, providers]
      summary: Synchronize a managed DNS record
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: takeover, in: query, schema: { type: boolean, default: false } }
      responses:
        "202":
          description: DNS synchronization started
  /api/v1/admin/certificates:
    get:
      tags: [admin, certificates]
      summary: List panel-managed certificates and latest ACME operation state
      responses:
        "200":
          description: Managed certificate page
    post:
      tags: [admin, certificates]
      summary: Create a managed certificate using Cloudflare DNS-01 or HTTP-01 Webroot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, name, domains, contact_email, challenge_type]
              properties:
                node_id: { type: integer, format: int64 }
                provider_account_id:
                  type: integer
                  format: int64
                  description: Required for dns-01 and omitted for http-01-webroot.
                name: { type: string, maxLength: 80 }
                domains:
                  type: array
                  minItems: 1
                  items: { type: string, maxLength: 253 }
                contact_email: { type: string, format: email }
                environment: { type: string, enum: [production, staging] }
                challenge_type: { type: string, enum: [dns-01, http-01-webroot] }
                webroot_path:
                  type: string
                  description: Canonical absolute node path required for http-01-webroot.
                auto_renew: { type: boolean }
                renew_before_days: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "201":
          description: Managed certificate created
  /api/v1/admin/certificates/{id}:
    get:
      tags: [admin, certificates]
      summary: Read a managed certificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Managed certificate detail
    put:
      tags: [admin, certificates]
      summary: Update mutable certificate metadata and renewal settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, contact_email, webroot_path, auto_renew, renew_before_days, expected_revision]
              properties:
                name: { type: string, maxLength: 80 }
                contact_email: { type: string, format: email }
                webroot_path: { type: string, description: Required only for HTTP-01 Webroot certificates. }
                auto_renew: { type: boolean }
                renew_before_days: { type: integer, minimum: 1, maximum: 60 }
                expected_revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: Certificate updated }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin, certificates]
      summary: Delete an unbound managed certificate
      description: Running issuance or renewal and protocol endpoint references block deletion. Remote certificate files are retained.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Managed certificate deleted }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/certificates/{id}/renewal:
    put:
      tags: [admin, certificates]
      summary: Update automatic renewal settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Renewal settings updated
  /api/v1/admin/certificates/{id}/issue:
    post:
      tags: [admin, certificates]
      summary: Start initial ACME issuance
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202":
          description: Issuance started
  /api/v1/admin/certificates/{id}/renew:
    post:
      tags: [admin, certificates]
      summary: Start ACME renewal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202":
          description: Renewal started
  /api/v1/system/configs:
    get:
      tags: [system]
      operationId: listPublicSystemConfigs
      summary: List public non-secret runtime configuration
      responses:
        "200":
          description: Public system configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SystemConfig" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system-configs:
    get:
      tags: [admin]
      operationId: listAdminSystemConfigs
      summary: List typed runtime configuration with secret values redacted
      responses:
        "200":
          description: System configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SystemConfig" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system-configs/{key}:
    put:
      tags: [admin]
      operationId: updateAdminSystemConfig
      summary: Update one typed system configuration value
      description: Existing keys only. Secret values are encrypted before storage and never returned. expected_revision enables optimistic concurrency control.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9_]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConfigUpdateRequest" }
      responses:
        "200":
          description: Updated system configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/SystemConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks:
    get:
      tags: [admin]
      operationId: listAdminTasks
      summary: List persisted administration tasks and aggregate item results
      parameters:
        - { name: paged, in: query, schema: { type: boolean }, description: Return the canonical page envelope instead of the legacy array. }
        - name: type
          in: query
          schema: { type: string, enum: [quota, email, node_detect, node_reconcile, node_lifecycle, protocol_deploy, protocol_active, node_group_reconcile] }
        - name: status
          in: query
          schema: { type: integer, minimum: 0, maximum: 3 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: "#/components/schemas/AdminTask" }
                          - $ref: "#/components/schemas/AdminTaskPage"
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createAdminTask
      summary: Create an auditable quota adjustment or email task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTaskCreateRequest" }
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks/{id}:
    get:
      tags: [admin]
      operationId: getAdminTask
      summary: Read one task summary or its legacy inline item result set
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: summary
          in: query
          schema: { type: boolean, default: false }
          description: Return the task summary without embedding item rows. Use the paginated items endpoint for scalable detail views.
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AdminTask"
                          - $ref: "#/components/schemas/AdminTaskDetail"
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks/{id}/items:
    get:
      tags: [admin]
      operationId: listAdminTaskItems
      summary: List one task's persisted target results
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Paginated task target results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTaskItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tasks/{id}/run:
    post:
      tags: [admin]
      operationId: runAdminTask
      summary: Start or retry a task asynchronously
      description: Completed items are skipped. Quota items are idempotent through quota-event references; email delivery is at-least-once when a process fails after SMTP accepts a message.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202": { description: Task execution started }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/node-operations:
    post:
      tags: [admin, nodes]
      operationId: createNodeBatchOperation
      summary: Create and start a persisted node batch operation
      description: Select either explicit node_ids or all_matching with the current workbench filters. Each resolved node is persisted as a TaskItem before asynchronous execution begins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeBatchOperationRequest" }
      responses:
        "202":
          description: Batch task accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-deployments/batch:
    post:
      tags: [admin, nodes]
      operationId: createProtocolBatchDeployment
      summary: Create and start a persisted node-deduplicated protocol deployment task
      description: The selected endpoint scope is snapshotted, then collapsed to one TaskItem per affected node because publishing always activates that node's complete current configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolBatchScopeRequest" }
      responses:
        "202":
          description: Batch deployment task accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/protocol-endpoints/batch:
    patch:
      tags: [admin, nodes]
      operationId: updateProtocolEndpointsBatch
      summary: Create and start a persisted node-grouped protocol endpoint activation task
      description: Selected endpoints are updated as one group per affected node and the complete node configuration is published once, with one durable TaskItem result per node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolBatchActiveRequest" }
      responses:
        "202":
          description: Batch activation task accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminTask" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthLoginResponse"
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Current user profile
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
  /api/v1/tickets:
    get:
      tags: [tickets]
      summary: List tickets owned by the current user
      description: This self-service route always keeps user scope, including when the signed-in user also has administrator permission.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/TicketCategory" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Ticket list in the canonical page envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/TicketPage" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [tickets]
      summary: Create a ticket and its first timeline message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreateRequest" }
      responses:
        "200": { description: Ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}:
    get:
      tags: [tickets]
      summary: Read a ticket and a bounded page of its timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: before_id, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Load messages older than this stable message ID. }
        - { name: message_limit, in: query, schema: { type: integer, minimum: 20, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Ticket detail with a bounded timeline page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/TicketDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}/messages:
    post:
      tags: [tickets]
      summary: Reply to a ticket
      description: A self-service reply moves the ticket to pending_admin. Closed tickets reject replies.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyRequest" }
      responses:
        "200": { description: Updated ticket detail }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}/close:
    post:
      tags: [tickets]
      summary: Close a ticket owned by the current user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Closed ticket detail }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tickets:
    get:
      tags: [tickets, admin]
      summary: List the global support queue
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [attention, open, pending_admin, pending_user, resolved, closed] }, description: "Use attention for the administrator work queue containing open and pending_admin tickets." }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/TicketCategory" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Global ticket list in the canonical page envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
